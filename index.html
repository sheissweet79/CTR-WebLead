<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CTR Aftermarket Website 고객 문의 보고서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f8fafc;--card:#ffffff;--text:#0f172a;--sub:#64748b;
  --border:#e2e8f0;--accent:#e42526;--accent2:#1e40af;
}
.dark{
  --bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--sub:#94a3b8;
  --border:#334155;--accent:#e42526;--accent2:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.3rem;font-weight:700;color:var(--accent)}
.header-sub{font-size:.8rem;color:var(--sub);margin-top:2px}
.header-right{display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;transition:.15s}
.btn:hover{background:var(--border)}
.container{max-width:1400px;margin:0 auto;padding:20px 16px}
/* Month Nav */
.nav-wrap{background:var(--card);border-radius:12px;padding:16px;margin-bottom:20px;border:1px solid var(--border)}
.year-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.year-tab{padding:5px 14px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:.82rem;background:var(--card);color:var(--sub);transition:.15s}
.year-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.month-btns{display:flex;gap:6px;flex-wrap:wrap}
.mo-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:.8rem;background:var(--card);color:var(--sub);transition:.15s}
.mo-btn:hover{border-color:var(--accent);color:var(--accent)}
.mo-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Grid 3col */
.grid3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:900px){.grid3{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border)}
.card h3{font-size:.85rem;color:var(--sub);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi-val{font-size:2.4rem;font-weight:800;color:var(--accent);line-height:1}
.kpi-sub{font-size:.78rem;color:var(--sub);margin-top:4px}
/* progress bar */
.prog-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.prog-label{font-size:.78rem;width:70px;flex-shrink:0;color:var(--sub)}
.prog-bar-wrap{flex:1;background:var(--border);border-radius:4px;height:8px;overflow:hidden}
.prog-bar{height:100%;border-radius:4px;transition:width .4s}
.prog-count{font-size:.78rem;width:28px;text-align:right;color:var(--text)}
/* Chart */
.chart-wrap{position:relative;height:220px}
/* Trend */
.trend-card{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);margin-bottom:20px}
.trend-card h3{font-size:.85rem;color:var(--sub);margin-bottom:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.trend-chart-wrap{position:relative;height:200px}
/* Region KPI grid */
.region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:700px){.region-grid{grid-template-columns:repeat(2,1fr)}}
.reg-card{background:var(--card);border-radius:12px;padding:14px;border:2px solid var(--border);cursor:pointer;transition:.15s}
.reg-card:hover{border-color:var(--accent)}
.reg-card.selected{border-color:var(--accent);background:rgba(228,37,38,.07)}
.reg-card .reg-name{font-size:.75rem;color:var(--sub);font-weight:600;text-transform:uppercase;margin-bottom:4px}
.reg-card .reg-count{font-size:1.6rem;font-weight:800;line-height:1}
.reg-card .reg-nl{font-size:.72rem;color:var(--sub);margin-top:3px}
/* Email cards */
.region-panel{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);margin-bottom:20px}
.region-panel h3{font-size:.85rem;color:var(--sub);margin-bottom:14px;font-weight:600}
.email-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ecard{background:var(--bg);border-radius:10px;padding:13px;border:1px solid var(--border)}
.ecard-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700;color:#fff}
.ecard-name{font-size:.88rem;font-weight:600}
.ecard-date{font-size:.72rem;color:var(--sub)}
.ecard-summary{font-size:.78rem;color:var(--sub);line-height:1.5;margin-top:4px}
.action-badge{display:inline-block;margin-top:6px;padding:3px 8px;background:rgba(228,37,38,.12);color:var(--accent);border-radius:6px;font-size:.7rem;font-weight:600}
/* Table */
.table-section{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);margin-bottom:20px}
.table-section h3{font-size:.85rem;color:var(--sub);margin-bottom:14px;font-weight:600}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-row select{padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--sub);font-weight:600;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
.footer{text-align:center;padding:20px;font-size:.75rem;color:var(--sub)}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🚗 CTR Aftermarket Website 고객 문의 보고서</h1>
    <div class="header-sub" id="lastUpdate">마지막 업데이트: —</div>
  </div>
  <div class="header-right">
    <button class="btn" onclick="toggleDark()">🌙 다크모드</button>
    <button class="btn" onclick="window.print()">🖨️ 인쇄</button>
  </div>
</div>

<div class="container">
  <!-- Month Nav -->
  <div class="nav-wrap">
    <div class="year-tabs" id="yearTabs"></div>
    <div class="month-btns" id="monthBtns"></div>
  </div>

  <!-- KPI + Charts -->
  <div class="grid3">
    <div>
      <div class="card" style="margin-bottom:14px">
        <h3>총 문의</h3>
        <div class="kpi-val" id="kpiTotal">—</div>
        <div class="kpi-sub" id="kpiSub">이번 달 누적</div>
      </div>
      <div class="card">
        <h3>뉴스레터 동의</h3>
        <div class="kpi-val" id="kpiNL">—</div>
        <div class="kpi-sub" id="kpiNLrate">—</div>
      </div>
    </div>
    <div class="card">
      <h3>지역별 문의 건수</h3>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <h3>문의 유형</h3>
        <div id="typeProgress"></div>
      </div>
      <div class="card">
        <h3>뉴스레터 동의율</h3>
        <div class="chart-wrap" style="height:150px"><canvas id="donutChart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- Trend -->
  <div class="trend-card">
    <h3>📈 월별 문의 추이</h3>
    <div class="trend-chart-wrap"><canvas id="trendChart"></canvas></div>
  </div>

  <!-- Region KPI -->
  <div class="region-grid" id="regionGrid"></div>

  <!-- Email Cards -->
  <div class="region-panel">
    <h3 id="panelTitle">📋 문의 상세 카드</h3>
    <div class="email-cards" id="emailCards"></div>
  </div>

  <!-- Table -->
  <div class="table-section">
    <h3>📊 상세 데이터 테이블</h3>
    <div class="filter-row">
      <select id="tblRegionFilter" onchange="renderTable()">
        <option value="all">전체 지역</option>
        <option value="na">북미</option>
        <option value="latam">중남미</option>
        <option value="eu">유럽</option>
        <option value="sea">동남아</option>
        <option value="af">아중동·아프리카</option>
        <option value="cis">CIS</option>
        <option value="ru">러시아</option>
        <option value="etc">기타</option>
      </select>
      <select id="tblTypeFilter" onchange="renderTable()">
        <option value="all">전체 유형</option>
        <option value="parts">부품 정보</option>
        <option value="purchase">구매/주문</option>
        <option value="price">가격/견적</option>
        <option value="technical">기술 지원</option>
        <option value="complaint">불만/A·S</option>
        <option value="empty">내용 없음</option>
        <option value="other">기타</option>
      </select>
      <button class="btn" onclick="resetFilters()">초기화</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>수신 일시</th><th>국가</th><th>이름</th><th>이메일</th>
          <th>전화</th><th>유형</th><th>NL</th><th>문의 요약</th><th>권고사항</th>
        </tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">© 2025 CTR Co., Ltd. — 자동 생성 보고서</div>

function buildNav(){
  const months=Object.keys(ALL_MONTHLY_DATA).sort();
  const years=[...new Set(months.map(m=>m.split('-')[0]))];
  const ytEl=document.getElementById('yearTabs');
  ytEl.innerHTML='';
  years.forEach(y=>{
    const b=document.createElement('button');
    b.className='year-tab';b.textContent=y+'년';
    b.onclick=()=>selectYear(y);
    b.dataset.year=y;
    ytEl.appendChild(b);
  });
  selectYear(years[years.length-1]);
}

function selectYear(year){
  document.querySelectorAll('.year-tab').forEach(b=>b.classList.toggle('active',b.dataset.year===year));
  const months=Object.keys(ALL_MONTHLY_DATA).filter(m=>m.startsWith(year)).sort();
  const mbEl=document.getElementById('monthBtns');
  mbEl.innerHTML='';
  months.forEach(m=>{
    const b=document.createElement('button');
    b.className='mo-btn'+(m===currentMonth?' active':'');
    b.textContent=m.split('-')[1]+'월';
    b.dataset.month=m;
    b.onclick=()=>loadMonth(m);
    mbEl.appendChild(b);
  });
  // trend
  renderTrendChart(year);
}

function loadMonth(ym){
  currentMonth=ym;
  currentRegion='all';
  document.querySelectorAll('.mo-btn').forEach(b=>b.classList.toggle('active',b.dataset.month===ym));
  const mo=ALL_MONTHLY_DATA[ym];
  if(!mo)return;
  // KPIs
  document.getElementById('kpiTotal').textContent=mo.total;
  document.getElementById('kpiSub').textContent=mo.label+' 누적';
  document.getElementById('kpiNL').textContent=mo.nlY;
  const rate=mo.total?Math.round(mo.nlY/mo.total*100):0;
  document.getElementById('kpiNLrate').textContent='동의율 '+rate+'%';
  renderBarChart(mo);
  renderDonutChart(mo);
  renderTypeProgress(mo, 'all');
  renderRegionGrid(mo);
  renderEmailCards(mo,'all');
  renderTable();
}

function renderBarChart(mo){
  const ctx=document.getElementById('barChart').getContext('2d');
  if(barChartInst)barChartInst.destroy();
  const regions=Object.keys(REGION_LABELS);
  barChartInst=new Chart(ctx,{
    type:'bar',
    data:{
      labels:regions.map(r=>REGION_LABELS[r]),
      datasets:[{data:regions.map(r=>mo.regionCounts[r]||0),backgroundColor:regions.map(r=>REGION_COLORS[r]),borderRadius:6}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,ticks:{stepSize:1},grid:{color:'rgba(128,128,128,.1)'}},
              x:{grid:{display:false}}},
      onClick:(_,el)=>{if(el.length)toggleRegion(regions[el[0].index])}}
  });
}

function renderDonutChart(mo){
  const ctx=document.getElementById('donutChart').getContext('2d');
  if(donutChartInst)donutChartInst.destroy();
  const nlY=mo.nlY,nlN=mo.total-mo.nlY;
  donutChartInst=new Chart(ctx,{
    type:'doughnut',
    data:{labels:['동의','미동의'],datasets:[{data:[nlY,nlN],backgroundColor:['#e42526','#e2e8f0'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}
  });
}

function renderTypeProgress(mo, region){
  const el=document.getElementById('typeProgress');
  const counts=region==='all'?mo.typeCounts:(mo.regionTypeCounts[region]||{});
  const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  const types=['purchase','parts','price','technical','complaint','empty','other'];
  el.innerHTML=types.map(t=>{
    const c=counts[t]||0;
    const pct=Math.round(c/total*100);
    return '<div class="prog-row"><div class="prog-label">'+TYPE_LABELS[t]+'</div><div class="prog-bar-wrap"><div class="prog-bar" style="width:'+pct+'%;background:'+TYPE_COLORS[t]+'"></div></div><div class="prog-count">'+c+'</div></div>';
  }).join('');
}

function renderRegionGrid(mo){
  const regions=Object.keys(REGION_LABELS);
  document.getElementById('regionGrid').innerHTML=regions.map(r=>{
    const cnt=mo.regionCounts[r]||0;
    const nl=mo.regionNL[r]||0;
    return '<div class="reg-card'+(currentRegion===r?' selected':'')+'" onclick="toggleRegion(''+r+'')" data-region="'+r+'" style="border-color:'+(currentRegion===r?REGION_COLORS[r]:'')+';color:'+(currentRegion===r?REGION_COLORS[r]:'')+'"><div class="reg-name">'+REGION_LABELS[r]+'</div><div class="reg-count" style="color:'+REGION_COLORS[r]+'">'+cnt+'</div><div class="reg-nl">NL동의 '+nl+'건</div></div>';
  }).join('');
}

function toggleRegion(r){
  currentRegion=(currentRegion===r)?'all':r;
  selectRegion(currentRegion);
}
function selectRegion(r){
  currentRegion=r;
  const mo=ALL_MONTHLY_DATA[currentMonth];
  document.querySelectorAll('.reg-card').forEach(c=>{
    const cr=c.dataset.region;
    c.classList.toggle('selected',cr===r);
    c.style.borderColor=cr===r?REGION_COLORS[cr]:'';
    c.style.color=cr===r?REGION_COLORS[cr]:'';
  });
  const panelTitle=r==='all'?'📋 문의 상세 카드 (전체)':'📋 '+REGION_LABELS[r]+' 문의 상세';
  document.getElementById('panelTitle').textContent=panelTitle;
  renderTypeProgress(mo,r);
  renderEmailCards(mo,r);
  renderTable();
}

function renderEmailCards(mo,region){
  const emails=region==='all'?mo.emails:mo.emails.filter(e=>e.region===region);
  const sorted=[...emails].sort((a,b)=>b.datetime.localeCompare(a.datetime));
  document.getElementById('emailCards').innerHTML=sorted.map(e=>'<div class="ecard"><div class="ecard-top"><span class="badge" style="background:'+REGION_COLORS[e.region]+'">'+REGION_LABELS[e.region]+'</span><span class="badge" style="background:'+TYPE_COLORS[e.type]+'">'+TYPE_LABELS[e.type]+'</span>'+(e.newsletter==='Y'?'<span class="badge" style="background:#0891B2">NL</span>':'')+'</div><div class="ecard-name">'+esc(e.name)+' <span style="font-size:.75rem;color:var(--sub)">('+esc(e.country)+')</span></div><div class="ecard-date">'+esc(e.datetime)+'</div><div class="ecard-summary">'+esc(e.summary)+'</div><div class="action-badge">'+esc(e.action)+'</div></div>').join('');
}

function renderTable(){
  const mo=ALL_MONTHLY_DATA[currentMonth];
  if(!mo)return;
  const rf=document.getElementById('tblRegionFilter').value;
  const tf=document.getElementById('tblTypeFilter').value;
  let emails=[...mo.emails].sort((a,b)=>b.datetime.localeCompare(a.datetime));
  if(currentRegion!=='all')emails=emails.filter(e=>e.region===currentRegion);
  if(rf!=='all')emails=emails.filter(e=>e.region===rf);
  if(tf!=='all')emails=emails.filter(e=>e.type===tf);
  document.getElementById('tblBody').innerHTML=emails.map(e=>'<tr><td style="white-space:nowrap">'+esc(e.datetime)+'</td><td><span style="color:'+REGION_COLORS[e.region]+';font-weight:600">'+esc(e.country)+'</span></td><td>'+esc(e.name)+'</td><td style="font-size:.73rem">'+esc(e.email)+'</td><td style="font-size:.73rem;white-space:nowrap">'+esc(e.phone)+'</td><td><span class="badge" style="background:'+TYPE_COLORS[e.type]+'">'+TYPE_LABELS[e.type]+'</span></td><td style="text-align:center">'+(e.newsletter==='Y'?'<span style="color:#0891B2;font-weight:700">Y</span>':e.newsletter)+'</td><td style="font-size:.75rem;max-width:240px">'+esc(e.summary)+'</td><td style="font-size:.73rem;color:var(--accent)">'+esc(e.action)+'</td></tr>').join('');
}

function renderTrendChart(year){
  const ctx=document.getElementById('trendChart').getContext('2d');
  if(trendChartInst)trendChartInst.destroy();
  const months=Object.keys(ALL_MONTHLY_DATA).filter(m=>m.startsWith(year)).sort();
  const labels=months.map(m=>m.split('-')[1]+'월');
  const totals=months.map(m=>ALL_MONTHLY_DATA[m].total);
  const pointColors=months.map(m=>m===currentMonth?'#e42526':'#1e40af');
  trendChartInst=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{
      label:'월별 문의수',data:totals,borderColor:'#1e40af',
      backgroundColor:'rgba(30,64,175,.1)',fill:true,tension:.3,
      pointBackgroundColor:pointColors,pointRadius:6,pointHoverRadius:8
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,ticks:{stepSize:5},grid:{color:'rgba(128,128,128,.1)'}},x:{grid:{display:false}}},
      onClick:(_,el)=>{if(el.length)loadMonth(months[el[0].index])}}
  });
}

function resetFilters(){
  document.getElementById('tblRegionFilter').value='all';
  document.getElementById('tblTypeFilter').value='all';
  renderTable();
}

function toggleDark(){
  document.body.classList.toggle('dark');
  const btn=document.querySelector('button');
  btn.textContent=document.body.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드';
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
</body>
</html>
