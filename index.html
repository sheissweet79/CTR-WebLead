<style>
:root {

  --border: #e2e8f0; --accent: #e42526; --accent2: #1d4ed8;
  --shadow: 0 1px 4px rgba(0,0,0,.08);
}
.dark {
  --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --sub: #94a3b8;
  --border: #334155; --shadow: 0 1px 4px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; transition: background .3s, color .3s; }
a { color: inherit; text-decoration: none; }

/* HEADER */
.hdr { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.hdr-left h1 { font-size: 17px; font-weight: 700; color: var(--accent); }
.hdr-left p { font-size: 11px; color: var(--sub); margin-top: 2px; }
.hdr-right { display: flex; gap: 8px; }
.btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 12px; transition: all .2s; }
.btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* NAV */
.nav-wrap { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.year-tab { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; font-size: 12px; font-weight: 600; transition: all .2s; }
.year-tab.active { background: #334155; color: #fff; border-color: #334155; }
.dark .year-tab.active { background: #475569; border-color: #475569; }
.month-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--sub); cursor: pointer; font-size: 12px; transition: all .2s; }
.month-btn:hover { border-color: var(--accent); color: var(--accent); }
.month-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.nav-divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

/* MAIN */
.main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
.section-title { font-size: 13px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .05em; margin: 24px 0 12px; }

/* KPI GRID */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.kpi-val { font-size: 36px; font-weight: 800; line-height: 1; margin: 8px 0 4px; }
.kpi-label { font-size: 12px; color: var(--sub); }
.kpi-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }

/* TYPE CARD */
.type-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.type-name { width: 72px; font-size: 12px; color: var(--sub); flex-shrink: 0; }
.type-bar-wrap { flex: 1; background: var(--border); border-radius: 99px; height: 8px; }
.type-bar { height: 8px; border-radius: 99px; }
.type-count { width: 28px; text-align: right; font-size: 12px; font-weight: 600; }

/* CHART GRID */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.chart-card { background: var(--card); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.chart-title { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 14px; text-transform: uppercase; letter-spacing: .04em; }
canvas { max-height: 220px; }

/* TREND */
.trend-card { background: var(--card); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }
#trendChart { max-height: 200px; }

/* REGION GRID */
.region-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.region-card { background: var(--card); border-radius: 10px; padding: 14px; border: 2px solid var(--border); cursor: pointer; transition: all .2s; }
.region-card:hover, .region-card.active { border-color: var(--accent); }
.region-card .r-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
.region-card .r-count { font-size: 22px; font-weight: 800; }
.region-card .r-nl { font-size: 11px; color: var(--sub); margin-top: 3px; }
.region-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }

/* RESET BTN */
.reset-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--sub); cursor: pointer; font-size: 12px; }
.reset-btn:hover { background: var(--border); }

/* EMAIL CARDS */
.email-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.email-card { background: var(--card); border-radius: 10px; padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); }
.email-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.email-name { font-weight: 600; font-size: 13px; }
.email-dt { font-size: 10px; color: var(--sub); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 600; }
.badge-region { color: #fff; }
.badge-type { margin-left: 4px; }
.email-summary { font-size: 12px; color: var(--sub); margin: 6px 0; line-height: 1.5; }
.email-meta { font-size: 11px; color: var(--sub); margin-top: 6px; }
.action-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; background: #fef3c7; color: #92400e; margin-top: 6px; }
.dark .action-badge { background: #422006; color: #fcd34d; }
.nl-badge { display: inline-block; padding: 1px 6px; border-radius: 99px; font-size: 10px; font-weight: 700; margin-left: 4px; }
.nl-y { background: #dcfce7; color: #166534; }
.nl-n { background: #fee2e2; color: #991b1b; }
.nl-blank { background: #f1f5f9; color: #64748b; }
.dark .nl-y { background: #14532d; color: #86efac; }
.dark .nl-n { background: #7f1d1d; color: #fca5a5; }
.dark .nl-blank { background: #334155; color: #94a3b8; }

/* TABLE */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: var(--border); padding: 8px 10px; text-align: left; font-weight: 600; position: sticky; top: 0; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: rgba(228,37,38,.04); }

/* FOOTER */
footer { text-align: center; padding: 20px; color: var(--sub); font-size: 11px; border-top: 1px solid var(--border); margin-top: 32px; }

@media print { .hdr-right, .nav-wrap { display: none; } }
</style>
</head>

</main>

  purchase:  { name: '구매/주문', color: '#10B981' },
  price:     { name: '가격/견적', color: '#F59E0B' },
  technical: { name: '기술 지원', color: '#8B5CF6' },
  complaint: { name: '불만/A·S', color: '#EF4444' },
  empty:     { name: '내용 없음', color: '#9CA3AF' },
  other:     { name: '기타',     color: '#6B7280' }
};

let currentMonth = '';
let currentRegion = 'all';
let barChartInst = null;
let donutChartInst = null;
let trendChartInst = null;

function toggleDark() {
  document.body.classList.toggle('dark');
  rebuildCharts();
}

// ── 내비게이터 ──────────────────────────────────────────────────────────────
function buildNav() {
  const wrap = document.getElementById('navWrap');
  const years = [...new Set(Object.keys(ALL_MONTHLY_DATA).map(k => k.split('-')[0]))].sort();
  let html = '';
  years.forEach(y => {
    html += `<button class="year-tab" id="ytab-${y}" onclick="loadYear('${y}')">${y}년</button>`;
    html += '<div class="nav-divider"></div>';
    Object.keys(ALL_MONTHLY_DATA).filter(k => k.startsWith(y)).sort().forEach(mk => {
      const m = mk.split('-')[1];
      html += `<button class="month-btn" id="mbtn-${mk}" onclick="loadMonth('${mk}')">${parseInt(m)}월</button>`;
    });
    html += '<div class="nav-divider"></div>';
  });
  wrap.innerHTML = html;
}

function loadYear(y) {
  document.querySelectorAll('.year-tab').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('ytab-' + y);
  if (el) el.classList.add('active');
  renderTrendChart(y);
}

function loadMonth(ym) {
  currentMonth = ym;
  selectRegion('all');
  document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('mbtn-' + ym);
  if (el) el.classList.add('active');
  const [y] = ym.split('-');
  loadYear(y);
  renderMonthUI();
}

// ── 월 UI ───────────────────────────────────────────────────────────────────
function renderMonthUI() {
  const d = ALL_MONTHLY_DATA[currentMonth];
  if (!d) return;
  document.getElementById('monthTitle').textContent = d.label + ' 요약';

  const rc = currentRegion === 'all' ? d.regionCounts : {};
  const filteredEmails = currentRegion === 'all'
    ? d.emails
    : d.emails.filter(e => e.region === currentRegion);

  // KPI 총 문의
  const tot = filteredEmails.length;
  document.getElementById('kpiTotal').textContent = tot + '건';
  document.getElementById('kpiRegionSub').textContent =
    currentRegion === 'all'
      ? `총 ${Object.keys(REGION_META).filter(r => d.regionCounts[r] > 0).length}개 지역`
      : REGION_META[currentRegion].name + ' 필터 적용';

  // KPI 뉴스레터
  const nlY = filteredEmails.filter(e => e.newsletter === 'Y').length;
  document.getElementById('kpiNL').textContent = nlY + '건';
  document.getElementById('kpiNLRate').textContent =
    tot > 0 ? `동의율 ${Math.round(nlY / tot * 100)}%` : '';

  // 유형 카드
  const typeMax = Math.max(...Object.values(TYPE_META).map(t => {
    const cnt = filteredEmails.filter(e => e.type === Object.keys(TYPE_META).find(k => TYPE_META[k] === t)).length;
    return cnt;
  }), 1);
  let typeHtml = '';
  Object.entries(TYPE_META).forEach(([k, v]) => {
    const cnt = filteredEmails.filter(e => e.type === k).length;
    const pct = Math.round(cnt / Math.max(tot, 1) * 100);
    typeHtml += `<div class="type-row">
      <span class="type-name">${v.name}</span>
      <div class="type-bar-wrap"><div class="type-bar" style="width:${pct}%;background:${v.color}"></div></div>
      <span class="type-count">${cnt}</span>
    </div>`;
  });
  document.getElementById('typeRows').innerHTML = typeHtml;

  // 차트 재렌더
  rebuildCharts();

  // 지역 그리드
  renderRegionGrid(d, filteredEmails);

  // 이메일 카드
  renderEmailCards(filteredEmails);

  // 테이블
  renderTable(filteredEmails);
}

// ── 차트 ────────────────────────────────────────────────────────────────────
function getChartColors() {
  const dark = document.body.classList.contains('dark');
  return { grid: dark ? '#334155' : '#e2e8f0', text: dark ? '#94a3b8' : '#64748b' };
}

function rebuildCharts() {
  const d = ALL_MONTHLY_DATA[currentMonth];
  if (!d) return;
  const filteredEmails = currentRegion === 'all'
    ? d.emails
    : d.emails.filter(e => e.region === currentRegion);
  const { grid, text } = getChartColors();

  // 막대 차트
  const barData = Object.entries(REGION_META).map(([k, v]) => ({
    label: v.name, value: filteredEmails.filter(e => e.region === k).length, color: v.color
  }));
  if (barChartInst) barChartInst.destroy();
  barChartInst = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: barData.map(r => r.label),
      datasets: [{ data: barData.map(r => r.value), backgroundColor: barData.map(r => r.color), borderRadius: 4 }]
    },
    options: {
      responsive: true, plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: text, font: { size: 10 } }, grid: { color: grid } },
        y: { ticks: { color: text, stepSize: 1, font: { size: 10 } }, grid: { color: grid }, beginAtZero: true }
      },
      onClick: (_, els) => { if (els.length) toggleRegion(Object.keys(REGION_META)[els[0].index]); }
    }
  });

  // 도넛 차트
  const nlY = filteredEmails.filter(e => e.newsletter === 'Y').length;
  const nlN = filteredEmails.filter(e => e.newsletter === 'N').length;
  const nlB = filteredEmails.filter(e => e.newsletter !== 'Y' && e.newsletter !== 'N').length;
  if (donutChartInst) donutChartInst.destroy();
  donutChartInst = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: {
      labels: ['동의', '미동의', '미표기'],
      datasets: [{ data: [nlY, nlN, nlB], backgroundColor: ['#10B981', '#EF4444', '#94A3B8'], borderWidth: 0 }]
    },
    options: {
      responsive: true, cutout: '65%',
      plugins: { legend: { position: 'bottom', labels: { color: text, font: { size: 10 }, padding: 8 } } }
    }
  });
}

function renderTrendChart(year) {
  const { grid, text } = getChartColors();
  const months = Object.keys(ALL_MONTHLY_DATA).filter(k => k.startsWith(year)).sort();
  const labels = months.map(m => parseInt(m.split('-')[1]) + '월');
  const totals = months.map(m => ALL_MONTHLY_DATA[m].total);
  const nlYs = months.map(m => ALL_MONTHLY_DATA[m].nlY);
  if (trendChartInst) trendChartInst.destroy();
  trendChartInst = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '총 문의', data: totals, borderColor: '#e42526', backgroundColor: 'rgba(228,37,38,.1)', tension: .3, fill: true,
          pointBackgroundColor: months.map(m => m === currentMonth ? '#e42526' : '#fff'),
          pointBorderColor: '#e42526', pointRadius: months.map(m => m === currentMonth ? 6 : 4) },
        { label: 'NL동의', data: nlYs, borderColor: '#10B981', backgroundColor: 'rgba(16,185,129,.08)', tension: .3, fill: true,
          pointBackgroundColor: '#10B981', pointRadius: 3 }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { color: text, font: { size: 10 }, padding: 6 } } },
      scales: {
        x: { ticks: { color: text, font: { size: 10 } }, grid: { color: grid } },
        y: { ticks: { color: text, font: { size: 10 } }, grid: { color: grid }, beginAtZero: true }
      },
      onClick: (_, els) => { if (els.length) loadMonth(months[els[0].index]); }
    }
  });
}

// ── 지역 그리드 ──────────────────────────────────────────────────────────────
function renderRegionGrid(d, filteredEmails) {
  const html = Object.entries(REGION_META).map(([k, v]) => {
    const cnt = d.emails.filter(e => e.region === k).length;
    const nlY = d.regionNL[k] || 0;
    const isActive = currentRegion === k ? ' active' : '';
    return `<div class="region-card${isActive}" onclick="toggleRegion('${k}')">
      <div class="r-label"><span class="region-dot" style="background:${v.color}"></span>${v.name}</div>
      <div class="r-count" style="color:${v.color}">${cnt}</div>
      <div class="r-nl">NL동의 ${nlY}건</div>
    </div>`;
  }).join('');
  document.getElementById('regionGrid').innerHTML = html;
}

// ── 이메일 카드 ─────────────────────────────────────────────────────────────
function renderEmailCards(emails) {
  if (emails.length === 0) {
    document.getElementById('emailGrid').innerHTML = '<p style="color:var(--sub);font-size:13px">해당 조건의 문의가 없습니다.</p>';
    return;
  }
  const html = emails.map(e => {
    const rm = REGION_META[e.region];
    const tm = TYPE_META[e.type];
    const nlCls = e.newsletter === 'Y' ? 'nl-y' : e.newsletter === 'N' ? 'nl-n' : 'nl-blank';
    const nlTxt = e.newsletter === 'Y' ? 'NL동의' : e.newsletter === 'N' ? 'NL미동의' : 'NL미표기';
    return `<div class="email-card">
      <div class="email-card-top">
        <div>
          <div class="email-name">${e.name}
            <span class="nl-badge ${nlCls}">${nlTxt}</span>
          </div>
          <div class="email-dt">${e.datetime}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <span class="badge badge-region" style="background:${rm.color}">${rm.name}</span><br>
          <span class="badge badge-type" style="background:${tm.color}20;color:${tm.color};margin-top:3px">${tm.name}</span>
        </div>
      </div>
      <div class="email-summary">${e.summary}</div>
      <div class="email-meta">🌍 ${e.country} &nbsp;|&nbsp; ✉️ ${e.email}</div>
      <div><span class="action-badge">⚡ ${e.action}</span></div>
    </div>`;
  }).join('');
  document.getElementById('emailGrid').innerHTML = html;
}

// ── 테이블 ───────────────────────────────────────────────────────────────────
function renderTable(emails) {
  const rows = emails.map(e => {
    const rm = REGION_META[e.region];
    const tm = TYPE_META[e.type];
    const nlCls = e.newsletter === 'Y' ? 'nl-y' : e.newsletter === 'N' ? 'nl-n' : 'nl-blank';
    return `<tr>
      <td>${e.datetime}</td>
      <td><span class="badge badge-region" style="background:${rm.color}">${e.country}</span></td>
      <td>${e.name}</td>
      <td style="font-size:11px">${e.email}</td>
      <td style="font-size:11px">${e.phone}</td>
      <td><span class="badge" style="background:${tm.color}20;color:${tm.color}">${tm.name}</span></td>
      <td><span class="nl-badge ${nlCls}">${e.newsletter}</span></td>
      <td style="max-width:280px;line-height:1.4">${e.summary}</td>
      <td style="font-size:11px;color:#92400e">${e.action}</td>
    </tr>`;
  }).join('');
  document.getElementById('tableBody').innerHTML = rows;
}

// ── 지역 필터 ────────────────────────────────────────────────────────────────
function toggleRegion(region) {
  if (currentRegion === region) selectRegion('all');
  else selectRegion(region);
}
function selectRegion(region) {
  currentRegion = region;
  const d = ALL_MONTHLY_DATA[currentMonth];
  if (!d) return;
  document.querySelectorAll('.region-card').forEach((c, i) => {
    const r = Object.keys(REGION_META)[i];
    c.classList.toggle('active', r === region);
  });
  document.getElementById('filterLabel').textContent =
    region === 'all' ? '' : '— ' + REGION_META[region].name + ' 필터';
  renderMonthUI();
}

// ── 초기화 ───────────────────────────────────────────────────────────────────
(function init() {
  buildNav();
  const months = Object.keys(ALL_MONTHLY_DATA).sort();
  const latest = months[months.length - 1];
  loadMonth(latest);
  const year = latest.split('-')[0];
  const ytab = document.getElementById('ytab-' + year);
  if (ytab) ytab.classList.add('active');
})();
</script>
</body>
</html>
