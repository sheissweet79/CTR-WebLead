<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTR Aftermarket Website — 고객 문의 누적 보고서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--card:#ffffff;--text:#0f172a;--sub:#64748b;--border:#e2e8f0;
  --accent:#e42526;--accent2:#1e40af;
  --na:#2563EB;--latam:#DC2626;--eu:#EA580C;--sea:#16A34A;
  --af:#7C3AED;--cis:#0891B2;--ru:#65A30D;--etc:#6B7280;
}
body.dark{
  --bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--sub:#94a3b8;--border:#334155;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
/* Header */
.header{background:var(--accent);color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:1.4rem;font-weight:700;letter-spacing:-.5px}
.header-left p{font-size:.8rem;opacity:.85;margin-top:2px}
.header-right{display:flex;gap:10px;align-items:center}
.header-right .updated{font-size:.75rem;opacity:.8}
.btn{cursor:pointer;border:none;border-radius:8px;padding:7px 14px;font-size:.82rem;font-weight:600;transition:.2s}
.btn-light{background:rgba(255,255,255,.2);color:#fff}
.btn-light:hover{background:rgba(255,255,255,.35)}
.btn-print{background:#fff;color:var(--accent)}
.btn-print:hover{opacity:.85}
/* Nav */
.nav{padding:16px 32px;border-bottom:1px solid var(--border);background:var(--card)}
.year-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.year-tab{cursor:pointer;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:600;border:2px solid var(--border);background:transparent;color:var(--sub);transition:.2s}
.year-tab.active{border-color:var(--accent);color:var(--accent)}
.month-btns{display:flex;gap:8px;flex-wrap:wrap}
.month-btn{cursor:pointer;padding:6px 18px;border-radius:20px;font-size:.82rem;font-weight:600;border:2px solid var(--border);background:transparent;color:var(--sub);transition:.2s}
.month-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.month-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
/* Main */
.main{padding:24px 32px;max-width:1400px;margin:0 auto}
/* Summary grid */
.summary-grid{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:18px;margin-bottom:24px}
@media(max-width:900px){.summary-grid{grid-template-columns:1fr}}
/* Cards */
.card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border)}
.kpi-row{display:flex;flex-direction:column;gap:14px}
.kpi-card{background:var(--card);border-radius:12px;padding:18px 20px;border:1px solid var(--border)}
.kpi-label{font-size:.78rem;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kpi-value{font-size:2.2rem;font-weight:800;line-height:1;margin:6px 0 2px}
.kpi-sub{font-size:.78rem;color:var(--sub)}
.kpi-accent{color:var(--accent)}
/* Type card */
.type-card{background:var(--card);border-radius:12px;padding:18px 20px;border:1px solid var(--border);flex:1}
.type-card h3{font-size:.82rem;font-weight:700;color:var(--sub);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.type-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.type-name{font-size:.78rem;min-width:68px;color:var(--text)}
.type-bar-wrap{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.type-bar{height:100%;border-radius:5px;transition:.4s}
.type-count{font-size:.78rem;color:var(--sub);min-width:24px;text-align:right}
/* Chart cards */
.chart-card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border);position:relative}
.chart-card h3{font-size:.85rem;font-weight:700;color:var(--sub);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.chart-wrap{position:relative;height:220px}
/* Trend */
.trend-section{margin-bottom:24px}
.trend-section .chart-wrap{height:180px}
/* Region grid */
.region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:800px){.region-grid{grid-template-columns:repeat(2,1fr)}}
.region-kpi{background:var(--card);border-radius:12px;padding:14px 16px;border:2px solid var(--border);cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.region-kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.region-kpi.na::before{background:var(--na)}
.region-kpi.latam::before{background:var(--latam)}
.region-kpi.eu::before{background:var(--eu)}
.region-kpi.sea::before{background:var(--sea)}
.region-kpi.af::before{background:var(--af)}
.region-kpi.cis::before{background:var(--cis)}
.region-kpi.ru::before{background:var(--ru)}
.region-kpi.etc::before{background:var(--etc)}
.region-kpi:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.region-kpi.selected{border-color:var(--accent);background:rgba(228,37,38,.05)}
.region-kpi .r-name{font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.5px}
.region-kpi .r-count{font-size:1.6rem;font-weight:800;margin:4px 0 2px}
.region-kpi .r-nl{font-size:.72rem;color:var(--sub)}
/* Email cards */
.email-panel{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:24px;overflow:hidden}
.email-panel-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.email-panel-header h3{font-size:.9rem;font-weight:700}
.filter-info{font-size:.78rem;color:var(--sub)}
.btn-reset{font-size:.75rem;padding:4px 10px;border-radius:6px;background:var(--border);color:var(--sub);border:none;cursor:pointer}
.btn-reset:hover{background:var(--accent);color:#fff}
.email-cards-wrap{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.email-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;transition:.2s}
.email-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(228,37,38,.08)}
.email-card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.badge-na{background:rgba(37,99,235,.15);color:var(--na)}
.badge-latam{background:rgba(220,38,38,.15);color:var(--latam)}
.badge-eu{background:rgba(234,88,12,.15);color:var(--eu)}
.badge-sea{background:rgba(22,163,74,.15);color:var(--sea)}
.badge-af{background:rgba(124,58,237,.15);color:var(--af)}
.badge-cis{background:rgba(8,145,178,.15);color:var(--cis)}
.badge-ru{background:rgba(101,163,13,.15);color:var(--ru)}
.badge-etc{background:rgba(107,114,128,.15);color:var(--etc)}
.badge-type-parts{background:rgba(14,165,233,.15);color:#0EA5E9}
.badge-type-purchase{background:rgba(16,185,129,.15);color:#10B981}
.badge-type-price{background:rgba(245,158,11,.15);color:#F59E0B}
.badge-type-technical{background:rgba(139,92,246,.15);color:#8B5CF6}
.badge-type-complaint{background:rgba(239,68,68,.15);color:#EF4444}
.badge-type-empty{background:rgba(156,163,175,.15);color:#9CA3AF}
.badge-type-other{background:rgba(107,114,128,.15);color:#6B7280}
.badge-nl-y{background:rgba(16,185,129,.15);color:#10B981}
.badge-nl-n{background:rgba(107,114,128,.15);color:#6B7280}
.email-card-name{font-size:.88rem;font-weight:700}
.email-card-info{font-size:.74rem;color:var(--sub);margin-bottom:6px}
.email-card-summary{font-size:.8rem;color:var(--text);line-height:1.5}
.email-card-action{font-size:.72rem;margin-top:8px;padding:3px 8px;border-radius:6px;display:inline-block;background:rgba(228,37,38,.1);color:var(--accent);font-weight:600}
/* Table */
.table-section{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:24px;overflow:hidden}
.table-section-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.table-section-header h3{font-size:.9rem;font-weight:700}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{padding:10px 14px;text-align:left;background:var(--bg);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(228,37,38,.03)}
.td-summary{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Footer */
.footer{text-align:center;padding:24px;font-size:.75rem;color:var(--sub);border-top:1px solid var(--border)}
/* Divider */
.section-title{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);margin-bottom:12px}
/* Print */
@media print{.header-right .btn,.nav,.btn-reset{display:none}.main{padding:12px}}
</style>
</head>

</div>

const REGION_LABELS={na:'북미',latam:'중남미',eu:'유럽',sea:'동남아',af:'아중동',cis:'CIS',ru:'러시아',etc:'기타'};
const REGION_COLORS={na:'#2563EB',latam:'#DC2626',eu:'#EA580C',sea:'#16A34A',af:'#7C3AED',cis:'#0891B2',ru:'#65A30D',etc:'#6B7280'};
const TYPE_LABELS={parts:'부품정보',purchase:'구매/주문',price:'가격/견적',technical:'기술지원',complaint:'불만/AS',empty:'내용없음',other:'기타'};
const TYPE_COLORS={parts:'#0EA5E9',purchase:'#10B981',price:'#F59E0B',technical:'#8B5CF6',complaint:'#EF4444',empty:'#9CA3AF',other:'#6B7280'};
const MONTHS_ALL=Object.keys(ALL_MONTHLY_DATA).sort();
let currentYM=MONTHS_ALL[MONTHS_ALL.length-1];
let selectedRegion='all';
let barChartInst=null, donutChartInst=null, trendChartInst=null;

function getYears(){
  const ys=new Set(MONTHS_ALL.map(m=>m.split('-')[0]));
  return [...ys].sort();
}
function getMonthsOfYear(y){return MONTHS_ALL.filter(m=>m.startsWith(y+''))}

function buildNav(){
  const years=getYears();
  const curYear=currentYM.split('-')[0];
  document.getElementById('yearTabs').innerHTML=years.map(y=>`
    <button class="year-tab ${y===curYear?'active':''}" onclick="switchYear('${y}')">${y}년</button>
  `).join('');
  const months=getMonthsOfYear(curYear);
  document.getElementById('monthBtns').innerHTML=months.map(ym=>{
    const d=ALL_MONTHLY_DATA[ym];
    const mm=ym.split('-')[1];
    return`<button class="month-btn ${ym===currentYM?'active':''}" onclick="loadMonth('${ym}')">${mm}월 <span style="font-size:.7rem;opacity:.7">(${d.total})</span></button>`;
  }).join('');
}
function switchYear(y){
  const months=getMonthsOfYear(y);
  if(!months.length)return;
  currentYM=months[months.length-1];
  selectedRegion='all';
  buildNav(); renderAll();
}
function loadMonth(ym){
  currentYM=ym;
  selectedRegion='all';
  buildNav(); renderAll();
}

function getFilteredEmails(){
  const d=ALL_MONTHLY_DATA[currentYM];
  if(!d)return[];
  if(selectedRegion==='all')return d.emails;
  return d.emails.filter(e=>e.region===selectedRegion);
}

function renderKPIs(){
  const d=ALL_MONTHLY_DATA[currentYM];
  if(!d)return;
  const emails=getFilteredEmails();
  const total=emails.length;
  const nlY=emails.filter(e=>e.newsletter==='Y').length;
  const pct=total?Math.round(nlY/total*100):0;
  document.getElementById('kpi-total').textContent=total+'건';
  document.getElementById('kpi-total-sub').textContent=selectedRegion==='all'?'이번 달 전체':REGION_LABELS[selectedRegion]+' 지역';
  document.getElementById('kpi-nl').textContent=nlY+'건';
  document.getElementById('kpi-nl-sub').textContent=`뉴스레터 동의율 ${pct}%`;
}

function renderTypeBars(){
  const emails=getFilteredEmails();
  const counts={parts:0,purchase:0,price:0,technical:0,complaint:0,empty:0,other:0};
  emails.forEach(e=>{if(counts[e.type]!==undefined)counts[e.type]++;else counts.other++;});
  const total=emails.length||1;
  const html=Object.entries(counts).map(([t,c])=>`
    <div class="type-row">
      <span class="type-name" style="color:${TYPE_COLORS[t]}">${TYPE_LABELS[t]}</span>
      <div class="type-bar-wrap"><div class="type-bar" style="width:${Math.round(c/total*100)}%;background:${TYPE_COLORS[t]}"></div></div>
      <span class="type-count">${c}</span>
    </div>
  `).join('');
  document.getElementById('type-bars').innerHTML=html;
}

function renderBarChart(){
  const emails=getFilteredEmails();
  const regions=['na','latam','eu','sea','af','cis','ru','etc'];
  const counts=Object.fromEntries(regions.map(r=>[r,0]));
  emails.forEach(e=>{if(counts[e.region]!==undefined)counts[e.region]++;});
  const labels=regions.map(r=>REGION_LABELS[r]);
  const data=regions.map(r=>counts[r]);
  const colors=regions.map(r=>REGION_COLORS[r]);
  const ctx=document.getElementById('barChart').getContext('2d');
  if(barChartInst)barChartInst.destroy();
  barChartInst=new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:6,borderSkipped:false}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>REGION_LABELS[regions[i[0].dataIndex]],label:i=>`${i.raw}건`}}},
      scales:{x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:11}}},y:{grid:{color:'rgba(148,163,184,.15)'},ticks:{color:'#94a3b8',stepSize:1}}},
      onClick:(e,els)=>{if(els.length)toggleRegion(regions[els[0].index]);}
    }
  });
}

function renderDonutChart(){
  const emails=getFilteredEmails();
  const nlY=emails.filter(e=>e.newsletter==='Y').length;
  const nlN=emails.filter(e=>e.newsletter==='N').length;
  const nlB=emails.filter(e=>e.newsletter!=='Y'&&e.newsletter!=='N').length;
  const ctx=document.getElementById('donutChart').getContext('2d');
  if(donutChartInst)donutChartInst.destroy();
  donutChartInst=new Chart(ctx,{
    type:'doughnut',
    data:{labels:['동의(Y)','미동의(N)','미표기'],datasets:[{data:[nlY,nlN,nlB],backgroundColor:['#10B981','#94a3b8','#334155'],borderWidth:2,borderColor:'transparent'}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'68%',
      plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',font:{size:11},padding:12}},
        tooltip:{callbacks:{label:i=>`${i.label}: ${i.raw}건 (${emails.length?Math.round(i.raw/emails.length*100):0}%)`}}}
    }
  });
}

function renderTrendChart(year){
  const months=getMonthsOfYear(year||currentYM.split('-')[0]);
  const labels=months.map(m=>m.split('-')[1]+'월');
  const totals=months.map(m=>(ALL_MONTHLY_DATA[m]||{total:0}).total);
  const pointColors=months.map(m=>m===currentYM?'#e42526':'rgba(148,163,184,.6)');
  const pointRadius=months.map(m=>m===currentYM?7:4);
  const ctx=document.getElementById('trendChart').getContext('2d');
  if(trendChartInst)trendChartInst.destroy();
  trendChartInst=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{data:totals,borderColor:'#e42526',backgroundColor:'rgba(228,37,38,.08)',fill:true,tension:.4,pointBackgroundColor:pointColors,pointRadius:pointRadius,pointHoverRadius:8}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>`${i.raw}건`}}},
      scales:{x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:11}}},y:{grid:{color:'rgba(148,163,184,.15)'},ticks:{color:'#94a3b8',stepSize:1},beginAtZero:true}},
      onClick:(e,els)=>{if(els.length)loadMonth(months[els[0].index]);}
    }
  });
}

function renderRegionGrid(){
  const d=ALL_MONTHLY_DATA[currentYM];
  if(!d)return;
  const regions=['na','latam','eu','sea','af','cis','ru','etc'];
  document.getElementById('regionGrid').innerHTML=regions.map(r=>`
    <div class="region-kpi ${r} ${selectedRegion===r?'selected':''}" onclick="toggleRegion('${r}')">
      <div class="r-name">${REGION_LABELS[r]}</div>
      <div class="r-count">${d.regionCounts[r]||0}</div>
      <div class="r-nl">뉴스레터 Y: ${d.regionNL[r]||0}건</div>
    </div>
  `).join('');
}

function nlBadge(nl){
  if(nl==='Y')return`<span class="badge badge-nl-y">NL ✓</span>`;
  if(nl==='N')return`<span class="badge badge-nl-n">NL ✗</span>`;
  return`<span class="badge badge-nl-n">NL -</span>`;
}
function typeBadge(t){return`<span class="badge badge-type-${t}">${TYPE_LABELS[t]||t}</span>`;}
function regionBadge(r){return`<span class="badge badge-${r}">${REGION_LABELS[r]||r}</span>`;}

function renderEmailCards(){
  const emails=getFilteredEmails();
  if(!emails.length){document.getElementById('emailCards').innerHTML='<div style="padding:32px;text-align:center;color:var(--sub)">해당 지역 문의 없음</div>';return;}
  document.getElementById('filterInfo').textContent=selectedRegion==='all'?`전체 ${emails.length}건`:`${REGION_LABELS[selectedRegion]} ${emails.length}건`;
  document.getElementById('emailCards').innerHTML=[...emails].reverse().map(e=>`
    <div class="email-card">
      <div class="email-card-top">
        ${regionBadge(e.region)}
        ${typeBadge(e.type)}
        ${nlBadge(e.newsletter)}
      </div>
      <div class="email-card-name">${e.name}</div>
      <div class="email-card-info">${e.country} &nbsp;·&nbsp; ${e.datetime} &nbsp;·&nbsp; ${e.email}</div>
      <div class="email-card-summary">${e.summary}</div>
      <div class="email-card-action">⚡ ${e.action}</div>
    </div>
  `).join('');
}

function renderTable(){
  const emails=getFilteredEmails();
  document.getElementById('tableBody').innerHTML=[...emails].reverse().map((e,i)=>`
    <tr>
      <td>${emails.length-i}</td>
      <td style="white-space:nowrap">${e.datetime}</td>
      <td>${regionBadge(e.region)}</td>
      <td>${e.country}</td>
      <td style="white-space:nowrap;font-weight:600">${e.name}</td>
      <td style="font-size:.74rem">${e.email}</td>
      <td style="font-size:.74rem">${e.phone}</td>
      <td>${typeBadge(e.type)}</td>
      <td>${nlBadge(e.newsletter)}</td>
      <td class="td-summary">${e.summary}</td>
      <td style="white-space:nowrap;font-size:.74rem;color:var(--accent)">${e.action}</td>
    </tr>
  `).join('');
}

function toggleRegion(r){
  selectedRegion=selectedRegion===r?'all':r;
  renderAll();
}
function selectRegion(r){
  selectedRegion=r;
  renderAll();
}

function renderAll(){
  renderKPIs();
  renderTypeBars();
  renderBarChart();
  renderDonutChart();
  renderTrendChart();
  renderRegionGrid();
  renderEmailCards();
  renderTable();
}

function toggleDark(){
  document.body.classList.toggle('dark');
}

// Updated time
const now=new Date();
const kst=new Date(now.getTime()+9*3600*1000);
const pad=n=>String(n).padStart(2,'0');
document.getElementById('updated-time').textContent=
  `마지막 업데이트: ${kst.getUTCFullYear()}-${pad(kst.getUTCMonth()+1)}-${pad(kst.getUTCDate())} ${pad(kst.getUTCHours())}:${pad(kst.getUTCMinutes())} KST`;

buildNav();
renderAll();
</script>
