<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --subtext: #64748b;
  --border: #e2e8f0; --accent: #e42526; --accent2: #1d4ed8;
  --shadow: 0 1px 4px rgba(0,0,0,0.08);
}
[data-theme="dark"] {
  --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --subtext: #94a3b8;
  --border: #334155; --shadow: 0 1px 4px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; transition: background .2s, color .2s; }
a { color: var(--accent2); text-decoration: none; }

/* HEADER */
.header { background: var(--accent); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 20px; font-weight: 700; }
.header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
.header-btns { display: flex; gap: 8px; }
.btn-icon { background: rgba(255,255,255,.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background .2s; }
.btn-icon:hover { background: rgba(255,255,255,.35); }

/* NAVIGATOR */
.nav-wrap { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.year-tab { background: none; border: 1px solid var(--border); color: var(--text); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .2s; }
.year-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.month-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.month-btn { border: 1px solid var(--border); background: none; color: var(--subtext); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .15s; }
.month-btn:hover { border-color: var(--accent); color: var(--accent); }
.month-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

/* MAIN GRID */
.main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
.grid3 { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 16px; margin-bottom: 20px; }
@media(max-width:1100px){ .grid3 { grid-template-columns: 1fr; } }

/* CARDS */
.card { background: var(--card); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.card-title { font-size: 12px; font-weight: 600; color: var(--subtext); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
.kpi-val { font-size: 38px; font-weight: 700; color: var(--text); }
.kpi-sub { font-size: 12px; color: var(--subtext); margin-top: 4px; }

/* PROGRESS BARS */
.pb-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
.pb-label { width: 68px; color: var(--subtext); text-align: right; flex-shrink: 0; }
.pb-bar-wrap { flex: 1; background: var(--border); border-radius: 4px; height: 8px; }
.pb-bar { height: 8px; border-radius: 4px; transition: width .4s; }
.pb-count { width: 28px; text-align: right; font-weight: 600; flex-shrink: 0; }

/* REGION GRID */
.region-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
@media(max-width:900px){ .region-grid { grid-template-columns: repeat(2,1fr); } }
.region-card { background: var(--card); border-radius: 10px; padding: 14px; border: 2px solid transparent; cursor: pointer; transition: all .15s; box-shadow: var(--shadow); }
.region-card:hover, .region-card.selected { border-color: var(--rc); transform: translateY(-2px); }
.region-card .rc-label { font-size: 11px; font-weight: 700; color: var(--subtext); }
.region-card .rc-val { font-size: 24px; font-weight: 700; margin: 4px 0; }
.region-card .rc-nl { font-size: 11px; color: var(--subtext); }

/* TABS */
.tab-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab-btn { border: 1px solid var(--border); background: none; color: var(--subtext); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all .15s; }
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* EMAIL CARDS */
.email-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.email-card { background: var(--card); border-radius: 10px; padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); }
.email-card .ec-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #fff; }
.ec-name { font-weight: 600; font-size: 13px; }
.ec-meta { font-size: 11px; color: var(--subtext); margin-top: 4px; }
.ec-summary { font-size: 12px; color: var(--text); margin-top: 6px; line-height: 1.5; }
.ec-action { margin-top: 8px; }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: var(--bg); padding: 8px 10px; text-align: left; font-weight: 600; color: var(--subtext); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: rgba(0,0,0,.02); }
.table-wrap { max-height: 480px; overflow-y: auto; border-radius: 10px; border: 1px solid var(--border); }

/* TREND */
.trend-wrap { background: var(--card); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
.section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; }

/* FILTER BAR */
.filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-bar select { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 5px 10px; border-radius: 6px; font-size: 12px; }
.reset-btn { border: 1px solid var(--border); background: none; color: var(--subtext); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.reset-btn:hover { border-color: var(--accent); color: var(--accent); }

/* FOOTER */
.footer { text-align: center; padding: 20px; color: var(--subtext); font-size: 11px; border-top: 1px solid var(--border); margin-top: 20px; }

@media print {
  .header-btns, .nav-wrap, .filter-bar, .tab-btns { display: none !important; }
  .card, .trend-wrap { box-shadow: none; border: 1px solid #ddd; }
}
</style>

      {
        "datetime": "2026-05-02 01:13 (KST)",
        "region": "latam",
        "country": "Paraguay",
        "name": "Víctor Aranda",
        "email": "victoraranda.import@gmail.con",
        "phone": "0987206921",
        "type": "purchase",
        "newsletter": "Y",
        "summary": "서스펜션 정비소 체인에 CTR 부품을 독점 사용하고자 파트너십 문의",
        "action": "영업팀 연락 필요"
      },
      {
        "datetime": "2026-05-01 11:49 (KST)",
        "region": "cis",
        "country": "Kyrgyzstan",
        "name": "Irbis",
        "email": "itikulov.irbis@yandex.com",
        "phone": "+996700135740",
        "type": "other",
        "newsletter": "N",

        "action": "담당자 검토 필요"

};
// __DATA_END__

const REGION_LABELS = {na:"북미",latam:"중남미",eu:"유럽",sea:"동남아",af:"아중동",cis:"CIS",ru:"러시아",etc:"기타"};
const REGION_COLORS = {na:"#2563EB",latam:"#DC2626",eu:"#EA580C",sea:"#16A34A",af:"#7C3AED",cis:"#0891B2",ru:"#65A30D",etc:"#6B7280"};
const TYPE_LABELS = {parts:"부품 정보",purchase:"구매/주문",price:"가격/견적",technical:"기술 지원",complaint:"불만/A·S",empty:"내용 없음",other:"기타"};
const TYPE_COLORS = {parts:"#0EA5E9",purchase:"#10B981",price:"#F59E0B",technical:"#8B5CF6",complaint:"#EF4444",empty:"#9CA3AF",other:"#6B7280"};
const REGIONS = ["na","latam","eu","sea","af","cis","ru","etc"];
const TYPES = ["parts","purchase","price","technical","complaint","empty","other"];

let currentYM = "";
let currentRegion = "all";
let barChart, donutChart, trendChart;

function sortedKeys() {
  return Object.keys(ALL_MONTHLY_DATA).sort();
}

function getYears() {
  const ys = new Set();
  sortedKeys().forEach(k => ys.add(k.split("-")[0]));
  return [...ys].sort();
}

function getMonthsOfYear(year) {
  return sortedKeys().filter(k => k.startsWith(year));
}

let currentYear = "";

function buildNav() {
  const years = getYears();
  currentYear = years[years.length-1];
  const nav = document.getElementById("navWrap");
  nav.innerHTML = "";

  // Year tabs
  const yearDiv = document.createElement("div");
  yearDiv.style.cssText = "display:flex;gap:6px;";
  years.forEach(y => {
    const btn = document.createElement("button");
    btn.className = "year-tab" + (y === currentYear ? " active" : "");
    btn.textContent = y + "년";
    btn.onclick = () => { currentYear = y; buildMonthBtns(); renderTrendChart(); };
    btn.id = "ytab_" + y;
    yearDiv.appendChild(btn);
  });
  nav.appendChild(yearDiv);

  const monthDiv = document.createElement("div");
  monthDiv.className = "month-btns";
  monthDiv.id = "monthBtns";
  nav.appendChild(monthDiv);
  buildMonthBtns();
}

function buildMonthBtns() {
  const months = getMonthsOfYear(currentYear);
  const div = document.getElementById("monthBtns");
  div.innerHTML = "";
  document.querySelectorAll(".year-tab").forEach(t => {
    t.classList.toggle("active", t.id === "ytab_" + currentYear);
  });
  months.forEach(ym => {
    const btn = document.createElement("button");
    btn.className = "month-btn" + (ym === currentYM ? " active" : "");
    const m = ym.split("-")[1];
    btn.textContent = parseInt(m) + "월";
    btn.id = "mbtn_" + ym;
    btn.onclick = () => loadMonth(ym);
    div.appendChild(btn);
  });
}

function loadMonth(ym) {
  currentYM = ym;
  currentRegion = "all";
  document.querySelectorAll(".month-btn").forEach(b => b.classList.toggle("active", b.id === "mbtn_" + ym));
  renderKPI();
  renderBarChart();
  renderDonutChart();
  renderTypeCard();
  renderRegionGrid();
  renderTabs();
  renderTable();
  renderTrendChart();
}

function getFilteredEmails() {
  const d = ALL_MONTHLY_DATA[currentYM];
  if (!d) return [];
  if (currentRegion === "all") return d.emails;
  return d.emails.filter(e => e.region === currentRegion);
}

function renderKPI() {
  const d = ALL_MONTHLY_DATA[currentYM];
  if (!d) return;
  const emails = getFilteredEmails();
  const total = emails.length;
  const nlY = emails.filter(e => e.newsletter === "Y").length;
  document.getElementById("kpiTotal").textContent = total.toLocaleString();
  document.getElementById("kpiTotalSub").textContent = d.label + (currentRegion !== "all" ? " · " + REGION_LABELS[currentRegion] : " · 전체");
  document.getElementById("kpiNL").textContent = nlY.toLocaleString();
  const rate = total > 0 ? Math.round(nlY / total * 100) : 0;
  document.getElementById("kpiNLSub").textContent = `동의율 ${rate}% · 전체 ${total}건`;
}

function renderTypeCard() {
  const d = ALL_MONTHLY_DATA[currentYM];
  if (!d) return;
  const emails = getFilteredEmails();
  const counts = {};
  TYPES.forEach(t => counts[t] = 0);
  emails.forEach(e => { if (counts[e.type] !== undefined) counts[e.type]++; else counts["other"]++; });
  const total = emails.length || 1;
  let html = "";
  TYPES.forEach(t => {
    const pct = Math.round(counts[t] / total * 100);
    html += `<div class="pb-row">
      <span class="pb-label">${TYPE_LABELS[t]}</span>
      <div class="pb-bar-wrap"><div class="pb-bar" style="width:${pct}%;background:${TYPE_COLORS[t]}"></div></div>
      <span class="pb-count">${counts[t]}</span>
    </div>`;
  });
  document.getElementById("typeCard").innerHTML = html;
}

function renderBarChart() {
  const d = ALL_MONTHLY_DATA[currentYM];
  if (!d) return;
  const emails = getFilteredEmails();
  const counts = {};
  REGIONS.forEach(r => counts[r] = 0);
  emails.forEach(e => { if (counts[e.region] !== undefined) counts[e.region]++; });
  const labels = REGIONS.map(r => REGION_LABELS[r]);
  const vals = REGIONS.map(r => counts[r]);
  const colors = REGIONS.map(r => currentRegion !== "all" && currentRegion !== r ? r_alpha(REGION_COLORS[r], 0.3) : REGION_COLORS[r]);
  if (barChart) barChart.destroy();
  const ctx = document.getElementById("barChart").getContext("2d");
  barChart = new Chart(ctx, {
    type: "bar",
    data: { labels, datasets: [{ data: vals, backgroundColor: colors, borderRadius: 5, borderSkipped: false }] },
    options: {
      responsive: true, plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: getComputedStyle(document.documentElement).getPropertyValue("--subtext") || "#64748b" } },
        y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: "rgba(0,0,0,0.05)" } }
      },
      onClick: (e, els) => {
        if (els.length) toggleRegion(REGIONS[els[0].index]);
      }
    }
  });
}

function r_alpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderDonutChart() {
  const emails = getFilteredEmails();
  const nlY = emails.filter(e => e.newsletter === "Y").length;
  const nlN = emails.filter(e => e.newsletter === "N").length;
  const nlB = emails.filter(e => e.newsletter !== "Y" && e.newsletter !== "N").length;
  if (donutChart) donutChart.destroy();
  const ctx = document.getElementById("donutChart").getContext("2d");
  donutChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: ["동의", "거부", "미표기"],
      datasets: [{ data: [nlY, nlN, nlB], backgroundColor: ["#10B981","#EF4444","#9CA3AF"], borderWidth: 2 }]
    },
    options: {
      responsive: true, cutout: "65%",
      plugins: { legend: { position: "bottom", labels: { font: { size: 11 }, padding: 8 } } }
    }
  });
}

function renderTrendChart() {
  const keys = sortedKeys();
  const labels = keys.map(k => { const [y,m] = k.split("-"); return y + "." + m; });
  const vals = keys.map(k => ALL_MONTHLY_DATA[k].total);
  if (trendChart) trendChart.destroy();
  const ctx = document.getElementById("trendChart").getContext("2d");
  const pointColors = keys.map(k => k === currentYM ? "#e42526" : "#2563EB");
  const pointSizes = keys.map(k => k === currentYM ? 8 : 5);
  trendChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "문의 건수",
        data: vals,
        borderColor: "#2563EB",
        backgroundColor: "rgba(37,99,235,0.08)",
        fill: true,
        tension: 0.3,
        pointBackgroundColor: pointColors,
        pointRadius: pointSizes,
        pointHoverRadius: 8
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, ticks: { stepSize: 5 } }
      },
      onClick: (e, els) => {
        if (els.length) loadMonth(keys[els[0].index]);
      }
    }
  });
}

function renderRegionGrid() {
  const d = ALL_MONTHLY_DATA[currentYM];
  if (!d) return;
  const emails = getFilteredEmails();
  const counts = {};
  REGIONS.forEach(r => counts[r] = 0);
  emails.forEach(e => { if (counts[e.region] !== undefined) counts[e.region]++; });
  let html = "";
  REGIONS.forEach(r => {
    const nlY = emails.filter(e => e.region===r && e.newsletter==="Y").length;
    const sel = currentRegion === r ? " selected" : "";
    html += `<div class="region-card${sel}" style="--rc:${REGION_COLORS[r]}" onclick="toggleRegion('${r}')">
      <div class="rc-label" style="color:${REGION_COLORS[r]}">${REGION_LABELS[r]}</div>
      <div class="rc-val" style="color:${REGION_COLORS[r]}">${counts[r]}</div>
      <div class="rc-nl">뉴스레터 ${nlY}건</div>
    </div>`;
  });
  document.getElementById("regionGrid").innerHTML = html;
}

function renderTabs() {
  const d = ALL_MONTHLY_DATA[currentYM];
  if (!d) return;
  const emails = d.emails;
  const tabBtns = document.getElementById("regionTabs");
  const panels = document.getElementById("regionPanels");
  tabBtns.innerHTML = "";
  panels.innerHTML = "";

  const allBtn = document.createElement("button");
  allBtn.className = "tab-btn" + (currentRegion==="all" ? " active" : "");
  allBtn.textContent = "전체 (" + emails.length + ")";
  allBtn.onclick = () => selectRegion("all");
  allBtn.id = "rtab_all";
  tabBtns.appendChild(allBtn);

  REGIONS.forEach(r => {
    const cnt = emails.filter(e => e.region===r).length;
    if (cnt === 0) return;
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (currentRegion===r ? " active" : "");
    btn.style.cssText = currentRegion===r ? `background:${REGION_COLORS[r]};border-color:${REGION_COLORS[r]}` : "";
    btn.textContent = REGION_LABELS[r] + " (" + cnt + ")";
    btn.onclick = () => selectRegion(r);
    btn.id = "rtab_" + r;
    tabBtns.appendChild(btn);
  });

  // Panels
  ["all", ...REGIONS].forEach(r => {
    const panel = document.createElement("div");
    panel.className = "tab-panel" + (currentRegion===r ? " active" : "");
    panel.id = "rpanel_" + r;
    const filtered = r==="all" ? emails : emails.filter(e=>e.region===r);
    if (filtered.length === 0) { panel.innerHTML = "<p style='color:var(--subtext);font-size:13px;padding:12px'>해당 지역 문의 없음</p>"; }
    else {
      const list = document.createElement("div");
      list.className = "email-list";
      filtered.forEach(em => {
        const typeColor = TYPE_COLORS[em.type] || "#6B7280";
        const regColor = REGION_COLORS[em.region] || "#6B7280";
        list.innerHTML += `<div class="email-card">
          <div class="ec-top">
            <span class="badge" style="background:${regColor}">${em.country}</span>
            <span style="font-size:11px;color:var(--subtext)">${em.datetime}</span>
          </div>
          <div class="ec-name">${em.name}</div>
          <div class="ec-meta">📧 ${em.email}</div>
          <div class="ec-meta">📞 ${em.phone}</div>
          <div class="ec-summary">${em.summary}</div>
          <div class="ec-action">
            <span class="badge" style="background:${typeColor}">${TYPE_LABELS[em.type]||em.type}</span>
            &nbsp;<span style="font-size:11px;color:var(--subtext)">${em.action}</span>
          </div>
        </div>`;
      });
      panel.appendChild(list);
    }
    panels.appendChild(panel);
  });
}

function toggleRegion(r) {
  if (currentRegion === r) selectRegion("all");
  else selectRegion(r);
}

function selectRegion(r) {
  currentRegion = r;
  renderKPI();
  renderTypeCard();
  renderDonutChart();
  renderRegionGrid();
  renderBarChart();

  // Update tab buttons
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.remove("active");
    b.style.background = "";
    b.style.borderColor = "";
    b.style.color = "";
  });
  const activeTab = document.getElementById("rtab_" + r);
  if (activeTab) {
    activeTab.classList.add("active");
    if (r !== "all") { activeTab.style.background = REGION_COLORS[r]; activeTab.style.borderColor = REGION_COLORS[r]; }
  }
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  const panel = document.getElementById("rpanel_" + r);
  if (panel) panel.classList.add("active");

  renderTable();
}

function renderTable() {
  const r = document.getElementById("filterRegion").value;
  const t = document.getElementById("filterType").value;
  const d = ALL_MONTHLY_DATA[currentYM];
  if (!d) return;
  let rows = d.emails;
  if (r !== "all") rows = rows.filter(e => e.region === r);
  if (t !== "all") rows = rows.filter(e => e.type === t);
  document.getElementById("tableCount").textContent = `${rows.length}건`;
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  rows.forEach(em => {
    const tr = document.createElement("tr");
    const typeColor = TYPE_COLORS[em.type] || "#6B7280";
    const regColor = REGION_COLORS[em.region] || "#6B7280";
    tr.innerHTML = `
      <td>${em.datetime}</td>
      <td><span class="badge" style="background:${regColor}">${REGION_LABELS[em.region]}</span></td>
      <td>${em.country}</td>
      <td><strong>${em.name}</strong></td>
      <td style="max-width:140px;word-break:break-all">${em.email}</td>
      <td>${em.phone}</td>
      <td><span class="badge" style="background:${typeColor}">${TYPE_LABELS[em.type]||em.type}</span></td>
      <td>${em.newsletter}</td>
      <td style="max-width:200px">${em.summary}</td>
      <td style="max-width:120px;color:var(--subtext)">${em.action}</td>
    `;
    tbody.appendChild(tr);
  });
}

function resetFilter() {
  document.getElementById("filterRegion").value = "all";
  document.getElementById("filterType").value = "all";
  renderTable();
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "" : "dark");
  localStorage.setItem("theme", cur === "dark" ? "light" : "dark");
}

// Init
(function() {
  const saved = localStorage.getItem("theme");
  if (saved === "dark") document.documentElement.setAttribute("data-theme","dark");
  const keys = sortedKeys();
  currentYM = keys[keys.length - 1];
  currentYear = currentYM.split("-")[0];
  buildNav();
  loadMonth(currentYM);
})();
</script>
</body>
