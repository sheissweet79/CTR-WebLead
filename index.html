<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTR Aftermarket Website 고객 문의 보고서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --sub: #64748b;
  --border: #e2e8f0; --accent: #e42526; --hover: #f1f5f9;
}
.dark {
  --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --sub: #94a3b8;
  --border: #334155; --hover: #273449;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); transition: .3s; min-height: 100vh; }
.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
.header-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
.header-right { display: flex; gap: 8px; align-items: center; }
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 12px; transition: .2s; }
.btn:hover { background: var(--hover); }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* 월 네비게이터 */
.nav-section { background: var(--card); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; border: 1px solid var(--border); }
.year-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.year-tab { padding: 4px 16px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; background: var(--bg); color: var(--sub); transition: .2s; }
.year-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.month-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.month-btn { padding: 6px 18px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; background: var(--bg); color: var(--text); transition: .2s; font-weight: 500; }
.month-btn:hover { border-color: var(--accent); color: var(--accent); }
.month-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* KPI 그리드 */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 900px) { .summary-grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
.kpi-value { font-size: 40px; font-weight: 700; color: var(--accent); }
.kpi-label { font-size: 13px; color: var(--sub); margin-top: 4px; }
.kpi-sub { font-size: 12px; color: var(--sub); margin-top: 8px; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: var(--text); }

/* 유형 progress bar */
.type-row { margin-bottom: 10px; }
.type-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.type-bar { height: 6px; border-radius: 3px; overflow: hidden; background: var(--border); }
.type-fill { height: 100%; border-radius: 3px; transition: width .5s; }

/* 지역 그리드 */
.region-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
@media (max-width: 900px) { .region-grid { grid-template-columns: repeat(2,1fr); } }
.region-card { background: var(--card); border-radius: 10px; padding: 14px; border: 2px solid var(--border); cursor: pointer; transition: .2s; text-align: center; }
.region-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.region-card.selected { border-color: var(--accent); background: #e425260d; }
.region-name { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
.region-count { font-size: 24px; font-weight: 700; }
.region-nl { font-size: 11px; color: var(--sub); margin-top: 4px; }

/* 이메일 카드 */
.email-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.email-card { background: var(--card); border-radius: 10px; padding: 16px; border: 1px solid var(--border); transition: .2s; }
.email-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(228,37,38,.1); }
.email-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.country-badge { font-size: 11px; padding: 2px 10px; border-radius: 20px; color: #fff; font-weight: 600; }
.type-badge { font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
.email-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.email-meta { font-size: 11px; color: var(--sub); margin-bottom: 8px; }
.email-summary { font-size: 12px; color: var(--sub); line-height: 1.5; margin-bottom: 8px; }
.action-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #e42526; color: #fff; display: inline-block; }
.nl-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
.nl-y { background: #dcfce7; color: #166534; }
.nl-n { background: #fee2e2; color: #991b1b; }

/* 테이블 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: var(--bg); padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--border); font-weight: 600; color: var(--sub); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: var(--hover); }

/* 차트 섹션 */
.chart-wrap { position: relative; height: 240px; }
.trend-section { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }

.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.reset-btn { font-size: 11px; padding: 4px 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); cursor: pointer; color: var(--sub); margin-left: 10px; }
.reset-btn:hover { color: var(--accent); border-color: var(--accent); }
footer { text-align: center; padding: 20px; font-size: 12px; color: var(--sub); border-top: 1px solid var(--border); margin-top: 20px; }
</style>
</head>

const REGION_LABELS = {na:'북미',latam:'중남미',eu:'유럽',sea:'동남아',af:'아중동',cis:'CIS',ru:'러시아',etc:'기타'};
const REGION_COLORS = {na:'#2563EB',latam:'#DC2626',eu:'#EA580C',sea:'#16A34A',af:'#7C3AED',cis:'#0891B2',ru:'#65A30D',etc:'#6B7280'};
const TYPE_LABELS = {parts:'부품 정보',purchase:'구매/주문',price:'가격/견적',technical:'기술 지원',complaint:'불만/A·S',empty:'내용 없음',other:'기타'};
const TYPE_COLORS = {parts:'#0EA5E9',purchase:'#10B981',price:'#F59E0B',technical:'#8B5CF6',complaint:'#EF4444',empty:'#9CA3AF',other:'#6B7280'};

let currentMonth = null, selectedRegion = 'all';
let barChartInst = null, trendChartInst = null;

function toggleDark() {
  document.body.classList.toggle('dark');
}

// ── 초기화 ──
function init() {
  const keys = Object.keys(ALL_MONTHLY_DATA).sort();
  const years = [...new Set(keys.map(k => k.split('-')[0]))];
  
  // 연도 탭
  const ytEl = document.getElementById('yearTabs');
  years.forEach(y => {
    const b = document.createElement('button');
    b.className = 'year-tab';
    b.textContent = y + '년';
    b.onclick = () => { renderMonthBtns(y); ytEl.querySelectorAll('.year-tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    ytEl.appendChild(b);
  });
  
  const latestYear = years[years.length - 1];
  ytEl.querySelector('.year-tab').classList.add('active');
  renderMonthBtns(latestYear);
  
  const latestMonth = keys[keys.length - 1];
  loadMonth(latestMonth);
  renderTrendChart(latestYear);
}

function renderMonthBtns(year) {
  const el = document.getElementById('monthBtns');
  el.innerHTML = '';
  Object.keys(ALL_MONTHLY_DATA).filter(k => k.startsWith(year)).forEach(m => {
    const b = document.createElement('button');
    b.className = 'month-btn' + (m === currentMonth ? ' active' : '');
    b.textContent = m.split('-')[1] + '월';
    b.id = 'mbtn-' + m;
    b.onclick = () => loadMonth(m);
    el.appendChild(b);
  });
}

function loadMonth(ym) {
  currentMonth = ym;
  selectedRegion = 'all';
  document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
  const mb = document.getElementById('mbtn-' + ym);
  if (mb) mb.classList.add('active');
  
  const d = ALL_MONTHLY_DATA[ym];
  if (!d) return;
  
  // KPI
  document.getElementById('kpiTotal').textContent = d.total;
  document.getElementById('kpiTotalSub').textContent = d.label + ' 누적 문의';
  document.getElementById('kpiNL').textContent = d.nlY;
  const pct = d.total > 0 ? Math.round(d.nlY / d.total * 100) : 0;
  document.getElementById('kpiNLSub').textContent = `동의율 ${pct}% (${d.total}건 중 ${d.nlY}건)`;
  
  renderTypeList(d, 'all');
  renderBarChart(d, 'all');
  renderRegionGrid(d);
  renderEmails(d.emails, 'all');
  renderTable(d.emails, 'all');
  document.getElementById('resetBtn').style.display = 'none';
  
  // 연도 탭 연동
  const year = ym.split('-')[0];
  document.querySelectorAll('.year-tab').forEach(b => {
    b.classList.toggle('active', b.textContent.startsWith(year));
  });
  renderMonthBtns(year);
  const mb2 = document.getElementById('mbtn-' + ym);
  if (mb2) mb2.classList.add('active');
  renderTrendChart(year);
}

function renderTypeList(d, region) {
  const el = document.getElementById('typeList');
  el.innerHTML = '';
  const tc = region === 'all' ? d.typeCounts : d.regionTypeCounts[region] || {};
  const total = Object.values(tc).reduce((a,b)=>a+b,0) || 1;
  const order = ['purchase','parts','price','technical','complaint','empty','other'];
  order.forEach(t => {
    const v = tc[t] || 0;
    const pct = Math.round(v / total * 100);
    el.innerHTML += `<div class="type-row">
      <div class="type-label"><span>${TYPE_LABELS[t]}</span><span>${v}건 (${pct}%)</span></div>
      <div class="type-bar"><div class="type-fill" style="width:${pct}%;background:${TYPE_COLORS[t]};"></div></div>
    </div>`;
  });
}

function renderBarChart(d, region) {
  const ctx = document.getElementById('barChart').getContext('2d');
  if (barChartInst) barChartInst.destroy();
  const regions = ['na','latam','eu','sea','af','cis','ru','etc'];
  const labels = regions.map(r => REGION_LABELS[r]);
  const values = regions.map(r => d.regionCounts[r] || 0);
  const colors = regions.map(r => r === region ? REGION_COLORS[r] : REGION_COLORS[r] + '99');
  barChartInst = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1, color: '#64748b' }, grid: { color: '#e2e8f020' } },
                 x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { display: false } } },
      onClick: (e, els) => {
        if (els.length) toggleRegion(regions[els[0].index]);
      }
    }
  });
}

function renderTrendChart(year) {
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChartInst) trendChartInst.destroy();
  const months = Array.from({length:12},(_,i)=>year+'-'+(i+1).toString().padStart(2,'0'));
  const labels = months.map(m=>parseInt(m.split('-')[1])+'월');
  const values = months.map(m => ALL_MONTHLY_DATA[m]?.total || null);
  const pointColors = months.map(m => m === currentMonth ? '#e42526' : '#2563EB');
  const pointSizes = months.map(m => m === currentMonth ? 7 : 4);
  trendChartInst = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{
      data: values, borderColor: '#2563EB', backgroundColor: '#2563EB20',
      pointBackgroundColor: pointColors, pointRadius: pointSizes,
      tension: 0.3, fill: true, spanGaps: false
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        label: ctx => ctx.raw !== null ? ctx.raw + '건' : '데이터 없음'
      } } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 5, color: '#64748b' }, grid: { color: '#e2e8f020' } },
                 x: { ticks: { color: '#64748b', font: { size: 11 } }, grid: { display: false } } },
      onClick: (e, els) => { if (els.length) loadMonth(months[els[0].index]); }
    }
  });
}

function renderRegionGrid(d) {
  const el = document.getElementById('regionGrid');
  el.innerHTML = '';
  const regions = ['na','latam','eu','sea','af','cis','ru','etc'];
  regions.forEach(r => {
    const cnt = d.regionCounts[r] || 0;
    const nl = d.regionNL[r] || 0;
    const div = document.createElement('div');
    div.className = 'region-card' + (r === selectedRegion ? ' selected' : '');
    div.style.borderColor = cnt > 0 ? REGION_COLORS[r] + '66' : 'var(--border)';
    div.innerHTML = `<div class="region-name">${REGION_LABELS[r]}</div>
      <div class="region-count" style="color:${REGION_COLORS[r]}">${cnt}</div>
      <div class="region-nl">뉴스레터Y: ${nl}건</div>`;
    div.onclick = () => toggleRegion(r);
    el.appendChild(div);
  });
}

function toggleRegion(r) {
  if (selectedRegion === r) { selectRegion('all'); return; }
  selectRegion(r);
}

function selectRegion(r) {
  selectedRegion = r;
  const d = ALL_MONTHLY_DATA[currentMonth];
  if (!d) return;
  
  document.querySelectorAll('.region-card').forEach((el, i) => {
    const regions = ['na','latam','eu','sea','af','cis','ru','etc'];
    el.classList.toggle('selected', regions[i] === r);
  });
  
  renderTypeList(d, r);
  renderBarChart(d, r);
  
  const filtered = r === 'all' ? d.emails : d.emails.filter(e => e.region === r);
  renderEmails(filtered, r);
  renderTable(filtered, r);
  
  const title = r === 'all' ? '📧 문의 상세' : `📧 ${REGION_LABELS[r]} 문의 (${filtered.length}건)`;
  document.getElementById('emailSectionTitle').textContent = title;
  document.getElementById('resetBtn').style.display = r === 'all' ? 'none' : 'inline-block';
}

function renderEmails(emails, region) {
  const el = document.getElementById('emailCards');
  if (!emails || emails.length === 0) {
    el.innerHTML = '<div style="color:var(--sub);font-size:13px;padding:20px;">문의 없음</div>';
    return;
  }
  const sorted = [...emails].sort((a,b) => b.datetime.localeCompare(a.datetime));
  el.innerHTML = sorted.map(e => `
    <div class="email-card">
      <div class="email-top">
        <span class="country-badge" style="background:${REGION_COLORS[e.region]}">${e.country}</span>
        <span class="type-badge" style="background:${TYPE_COLORS[e.type]}22;color:${TYPE_COLORS[e.type]}">${TYPE_LABELS[e.type]}</span>
      </div>
      <div class="email-name">${e.name} <span class="nl-badge ${e.newsletter==='Y'?'nl-y':'nl-n'}">NL ${e.newsletter}</span></div>
      <div class="email-meta">${e.datetime} &nbsp;·&nbsp; ${e.email}</div>
      <div class="email-summary">${e.summary}</div>
      <span class="action-badge">${e.action}</span>
    </div>
  `).join('');
}

function renderTable(emails, region) {
  const tbody = document.getElementById('tableBody');
  if (!emails || emails.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--sub);">데이터 없음</td></tr>';
    return;
  }
  const sorted = [...emails].sort((a,b) => b.datetime.localeCompare(a.datetime));
  tbody.innerHTML = sorted.map(e => `<tr>
    <td style="white-space:nowrap">${e.datetime}</td>
    <td><span style="color:${REGION_COLORS[e.region]};font-weight:600">${REGION_LABELS[e.region]}</span></td>
    <td>${e.country}</td>
    <td>${e.name}</td>
    <td style="font-size:11px">${e.email}</td>
    <td style="font-size:11px">${e.phone}</td>
    <td><span style="color:${TYPE_COLORS[e.type]};font-weight:600">${TYPE_LABELS[e.type]}</span></td>
    <td><span class="nl-badge ${e.newsletter==='Y'?'nl-y':'nl-n'}" style="padding:2px 8px;border-radius:10px">${e.newsletter}</span></td>
    <td style="max-width:250px;font-size:11px">${e.summary}</td>
    <td style="font-size:11px;white-space:nowrap">${e.action}</td>
  </tr>`).join('');
}

init();
</script>
</body>
</html>
