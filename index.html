<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --sub:#64748b; --border:#e2e8f0;
    --accent:#e42526;
  }
  [data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Pretendard,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  header h1{font-size:20px;margin:0;color:var(--accent);}
  header .sub{font-size:13px;color:var(--sub);margin-top:4px;}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;}
  .nav{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .nav select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
  .kpi .num{font-size:24px;font-weight:700;color:var(--accent);}
  .kpi .lbl{font-size:12px;color:var(--sub);margin-top:4px;}
  h2.section{font-size:15px;margin:26px 0 12px;color:var(--text);border-left:4px solid var(--accent);padding-left:8px;}
  .region-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .region-kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .region-kpi .rname{font-size:12px;color:var(--sub);}
  .region-kpi .rnum{font-size:20px;font-weight:700;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
  .email-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:14px;font-size:13px;}
  .email-card .top{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:6px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;color:#fff;margin-right:4px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);}
  th,td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;}
  th{background:rgba(228,37,38,0.08);position:sticky;top:0;}
  .table-wrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
  footer{margin-top:30px;font-size:12px;color:var(--sub);text-align:center;}
  canvas{max-height:280px;}
</style>
</head>
<body data-theme="light">
<div class="wrap">
  <header>
    <div>
      <h1>CTR Aftermarket Website 고객 문의 누적 보고서</h1>
      <div class="sub" id="lastUpdate">마지막 업데이트: 2026-09-15 08:31 (KST)</div>
    </div>
    <button class="btn" onclick="toggleTheme()">다크/라이트 전환</button>
  </header>

  <div class="nav">
    <label for="monthSelect" style="font-size:13px;color:var(--sub);">조회 월</label>
    <select id="monthSelect" onchange="renderMonth(this.value)"></select>
  </div>

  <div class="grid3">
    <div class="card">
      <div class="kpis" id="kpiRow"></div>
    </div>
    <div class="card">
      <canvas id="typeChart"></canvas>
    </div>
    <div class="card">
      <canvas id="regionChart"></canvas>
    </div>
  </div>

  <h2 class="section">월별 추이</h2>
  <div class="card">
    <canvas id="trendChart"></canvas>
  </div>

  <h2 class="section">지역별 현황</h2>
  <div class="region-grid" id="regionGrid"></div>

  <h2 class="section">최근 문의</h2>
  <div class="cards" id="emailCards"></div>

  <h2 class="section">상세 데이터</h2>
  <div class="table-wrap">
    <table id="detailTable">
      <thead>
        <tr>

      <tbody></tbody>
    </table>
  </div>

  <footer>CTR Aftermarket Website 고객 문의 누적 보고서 · 자동 생성</footer>
</div>

function toggleTheme(){
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
}

function populateMonthSelect(){
  const sel = document.getElementById("monthSelect");
  const keys = Object.keys(ALL_MONTHLY_DATA).sort();
  sel.innerHTML = keys.map(k => `<option value="${k}">${ALL_MONTHLY_DATA[k].label}</option>`).join("");
  sel.value = keys[keys.length-1];
}

function renderMonth(key){
  const data = ALL_MONTHLY_DATA[key];
  if(!data) return;

  document.getElementById("kpiRow").innerHTML = `
    <div class="kpi"><div class="num">${data.total}</div><div class="lbl">전체 문의</div></div>
    <div class="kpi"><div class="num">${data.nlY}</div><div class="lbl">뉴스레터 동의(Y)</div></div>
    <div class="kpi"><div class="num">${data.typeCounts.purchase}</div><div class="lbl">구매/주문 문의</div></div>
    <div class="kpi"><div class="num">${data.typeCounts.complaint}</div><div class="lbl">불만/A·S 문의</div></div>
  `;

  const regionGrid = document.getElementById("regionGrid");
  regionGrid.innerHTML = Object.keys(REGION_META).map(r => `
    <div class="region-kpi" style="border-top:3px solid ${REGION_META[r].color}">
      <div class="rnum">${data.regionCounts[r] || 0}</div>
      <div class="rname">${REGION_META[r].label}</div>
    </div>
  `).join("");

  const cardsEl = document.getElementById("emailCards");
  cardsEl.innerHTML = data.emails.slice(0,9).map(e => `
    <div class="email-card">
      <div class="top"><span>${e.datetime}</span><span>${e.country}</span></div>
      <div style="margin-bottom:6px;">
        <span class="badge" style="background:${TYPE_META[e.type].color}">${TYPE_META[e.type].label}</span>
        <span class="badge" style="background:${e.newsletter==='Y' ? '#16A34A' : '#94A3B8'}">뉴스레터 ${e.newsletter}</span>
      </div>
      <div style="font-weight:600;margin-bottom:4px;">${e.name}</div>
      <div style="color:var(--sub);margin-bottom:6px;">${e.email} · ${e.phone}</div>
      <div>${e.summary}</div>
      <div style="margin-top:8px;font-size:12px;color:var(--accent);">▶ ${e.action}</div>
    </div>
  `).join("");

  const tbody = document.querySelector("#detailTable tbody");
  tbody.innerHTML = data.emails.map(e => `
    <tr>
      <td>${e.datetime}</td>
      <td>${REGION_META[e.region].label}</td>
      <td>${e.country}</td>
      <td>${e.name}</td>
      <td>${e.email}</td>
      <td>${e.phone}</td>
      <td><span class="badge" style="background:${TYPE_META[e.type].color}">${TYPE_META[e.type].label}</span></td>
      <td>${e.newsletter}</td>
      <td>${e.summary}</td>
      <td>${e.action}</td>
    </tr>
  `).join("");

  renderCharts(data);
}

function renderCharts(data){
  ["typeChart","regionChart","trendChart"].forEach(id=>{ if(charts[id]) charts[id].destroy(); });

  charts.typeChart = new Chart(document.getElementById("typeChart"), {
    type:"doughnut",
    data:{
      labels: Object.keys(TYPE_META).map(k=>TYPE_META[k].label),
      datasets:[{ data: Object.keys(TYPE_META).map(k=>data.typeCounts[k]||0),
        backgroundColor: Object.keys(TYPE_META).map(k=>TYPE_META[k].color) }]
    },
    options:{ plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, font:{size:11} } } } }
  });

  charts.regionChart = new Chart(document.getElementById("regionChart"), {
    type:"bar",
    data:{
      labels: Object.keys(REGION_META).map(k=>REGION_META[k].label),
      datasets:[{ label:"문의 건수", data: Object.keys(REGION_META).map(k=>data.regionCounts[k]||0),
        backgroundColor: Object.keys(REGION_META).map(k=>REGION_META[k].color) }]
    },
    options:{ plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
  });

  const keys = Object.keys(ALL_MONTHLY_DATA).sort();
  charts.trendChart = new Chart(document.getElementById("trendChart"), {
    type:"line",
    data:{
      labels: keys.map(k=>ALL_MONTHLY_DATA[k].label),
      datasets:[{ label:"월별 전체 문의", data: keys.map(k=>ALL_MONTHLY_DATA[k].total),
        borderColor:"#e42526", backgroundColor:"rgba(228,37,38,0.15)", tension:0.3, fill:true }]
    },
    options:{ plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
  });
}

populateMonthSelect();
renderMonth(document.getElementById("monthSelect").value);
</script>
