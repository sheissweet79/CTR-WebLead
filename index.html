<style>
:root {

}
.dark {

}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; transition:background .3s,color .3s; }
.header { background:var(--accent); color:#fff; padding:20px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.header h1 { font-size:20px; font-weight:700; }
.header-sub { font-size:12px; opacity:.85; }
.header-actions { display:flex; gap:8px; align-items:center; }
.btn { padding:6px 14px; border-radius:6px; border:none; cursor:pointer; font-size:13px; font-weight:600; }
.btn-white { background:#fff; color:var(--accent); }
.btn-outline { background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.6); }
.nav-section { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--border); }
.year-tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.year-tab { padding:6px 16px; border-radius:20px; border:1.5px solid var(--border); background:transparent; color:var(--text); cursor:pointer; font-weight:600; font-size:13px; }
.year-tab.active { background:var(--text); color:var(--bg); border-color:var(--text); }
.month-btns { display:flex; gap:6px; flex-wrap:wrap; }
.month-btn { padding:5px 14px; border-radius:16px; border:1.5px solid var(--border); background:transparent; color:var(--text); cursor:pointer; font-size:13px; font-weight:500; }
.month-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.container { max-width:1400px; margin:0 auto; padding:20px 24px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:20px; }
@media(max-width:900px) { .grid-3 { grid-template-columns:1fr; } }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
.kpi-val { font-size:36px; font-weight:800; color:var(--accent); }
.kpi-label { font-size:12px; color:var(--sub); margin-top:4px; }
.kpi-nl { font-size:22px; font-weight:700; color:#10B981; }
.section-title { font-size:16px; font-weight:700; margin-bottom:14px; }
.type-bar-row { margin-bottom:8px; }
.type-bar-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
.type-bar-track { background:var(--border); border-radius:4px; height:7px; }
.type-bar-fill { height:7px; border-radius:4px; transition:width .5s; }
.trend-section { margin-bottom:20px; }
.region-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
@media(max-width:900px) { .region-grid { grid-template-columns:repeat(2,1fr); } }
.region-card { background:var(--card); border:2px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; transition:all .2s; }
.region-card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.1); }
.region-card.active { box-shadow:0 0 0 2px var(--accent); }
.region-name { font-size:11px; font-weight:600; color:var(--sub); margin-bottom:4px; text-transform:uppercase; }
.region-count { font-size:24px; font-weight:800; }
.region-nl { font-size:11px; color:var(--sub); margin-top:3px; }
.tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:16px; flex-wrap:wrap; }
.tab { padding:8px 16px; border:none; background:transparent; color:var(--sub); cursor:pointer; font-size:13px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-2px; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
.email-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.email-card { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; }
.email-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; color:#fff; }
.email-name { font-weight:700; font-size:14px; }
.email-datetime { font-size:11px; color:var(--sub); }
.email-summary { font-size:12px; color:var(--sub); margin:6px 0; line-height:1.5; }
.action-badge { display:inline-block; padding:2px 8px; border-radius:8px; font-size:11px; background:#fef3c7; color:#92400e; font-weight:600; margin-top:4px; }
.dark .action-badge { background:#422006; color:#fbbf24; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:var(--border); padding:10px 12px; text-align:left; font-weight:600; position:sticky; top:0; z-index:1; }
td { padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
tr:hover td { background:var(--border); }
.table-wrap { overflow-x:auto; border-radius:10px; border:1px solid var(--border); }
.filter-bar { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.reset-btn { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; font-size:12px; }
.footer { text-align:center; padding:20px; font-size:12px; color:var(--sub); border-top:1px solid var(--border); margin-top:20px; }
.nl-y { color:#10B981; font-weight:700; }
.nl-n { color:var(--sub); }
</style>
</head>

const REGION_LABELS = {na:'북미',latam:'중남미',eu:'유럽',sea:'동남아',af:'아중동',cis:'CIS',ru:'러시아',etc:'기타'};
const REGION_COLORS = {na:'#2563EB',latam:'#DC2626',eu:'#EA580C',sea:'#16A34A',af:'#7C3AED',cis:'#0891B2',ru:'#65A30D',etc:'#6B7280'};
const TYPE_LABELS = {parts:'부품 정보',purchase:'구매/주문',price:'가격/견적',technical:'기술 지원',complaint:'불만/A·S',empty:'내용 없음',other:'기타'};
const TYPE_COLORS = {parts:'#0EA5E9',purchase:'#10B981',price:'#F59E0B',technical:'#8B5CF6',complaint:'#EF4444',empty:'#9CA3AF',other:'#6B7280'};

let currentMonth = '';
let currentRegion = 'all';
let currentYear = '';
let charts = {};

function getYears() {
  const months = Object.keys(ALL_MONTHLY_DATA).sort();
  const years = [...new Set(months.map(m => m.split('-')[0]))];
  return years;
}

function getMonthsOfYear(year) {
  return Object.keys(ALL_MONTHLY_DATA).filter(m => m.startsWith(year)).sort();
}

function initNav() {
  const years = getYears();
  const latestMonth = Object.keys(ALL_MONTHLY_DATA).sort().pop();
  currentYear = latestMonth.split('-')[0];
  currentMonth = latestMonth;

  const yearTabs = document.getElementById('yearTabs');
  yearTabs.innerHTML = years.map(y =>
    `<button class="year-tab ${y===currentYear?'active':''}" onclick="selectYear('${y}')">${y}년</button>`
  ).join('');

  renderMonthBtns();
}

function selectYear(year) {
  currentYear = year;
  document.querySelectorAll('.year-tab').forEach(t => t.classList.toggle('active', t.textContent===year+'년'));
  const months = getMonthsOfYear(year);
  currentMonth = months[months.length-1];
  renderMonthBtns();
  loadMonth(currentMonth);
}

function renderMonthBtns() {
  const months = getMonthsOfYear(currentYear);
  const monthBtns = document.getElementById('monthBtns');
  monthBtns.innerHTML = months.map(m => {
    const d = ALL_MONTHLY_DATA[m];
    return `<button class="month-btn ${m===currentMonth?'active':''}" onclick="loadMonth('${m}')">${d.label}</button>`;
  }).join('');
}

function loadMonth(ym) {
  currentMonth = ym;
  currentYear = ym.split('-')[0];
  document.querySelectorAll('.month-btn').forEach(b => b.classList.toggle('active', b.textContent===ALL_MONTHLY_DATA[ym]?.label));
  selectRegion('all');
}

function getFilteredData() {
  const d = ALL_MONTHLY_DATA[currentMonth];
  if (!d) return {emails:[],regionCounts:{},typeCounts:{},nlY:0,total:0};
  if (currentRegion === 'all') return d;
  const emails = d.emails.filter(e => e.region === currentRegion);
  const rc = {...d.regionCounts};
  const tc = {...d.typeCounts};
  Object.keys(tc).forEach(k => tc[k]=0);
  let nlY=0;
  emails.forEach(e => { if(tc[e.type]!==undefined) tc[e.type]++; if(e.newsletter==='Y') nlY++; });
  return {emails, regionCounts:rc, typeCounts:tc, nlY, total:emails.length};
}

function selectRegion(region) {
  currentRegion = region;
  document.querySelectorAll('.region-card').forEach(c => c.classList.toggle('active', c.dataset.region===region));
  renderAll();
}

function toggleRegion(region) {
  selectRegion(currentRegion===region ? 'all' : region);
}

function renderAll() {
  renderKPI();
  renderTypeBars();
  renderNLChart();
  renderRegionChart();
  renderTrendChart(currentYear);
  renderRegionGrid();
  renderEmailPanel();
  renderTable();
}

function renderKPI() {
  const d = ALL_MONTHLY_DATA[currentMonth];
  if (!d) return;
  const fd = getFilteredData();
  document.getElementById('kpiTotal').textContent = fd.total + '건';
  document.getElementById('kpiRegionNote').textContent = currentRegion==='all' ? '전체 지역' : REGION_LABELS[currentRegion]+' 필터 적용';
  document.getElementById('kpiNL').textContent = fd.nlY + '건';
  const pct = fd.total>0 ? Math.round(fd.nlY/fd.total*100) : 0;
  document.getElementById('kpiNLPct').textContent = `동의율 ${pct}%`;
}

function renderTypeBars() {
  const d = ALL_MONTHLY_DATA[currentMonth];
  if (!d) return;
  const fd = getFilteredData();
  const total = fd.total || 1;
  const el = document.getElementById('typeBars');
  el.innerHTML = Object.entries(fd.typeCounts).map(([t,v]) => {
    const pct = Math.round(v/total*100);
    return `<div class="type-bar-row">
      <div class="type-bar-label"><span style="color:${TYPE_COLORS[t]};font-weight:600">${TYPE_LABELS[t]||t}</span><span>${v}건 (${pct}%)</span></div>
      <div class="type-bar-track"><div class="type-bar-fill" style="width:${pct}%;background:${TYPE_COLORS[t]}"></div></div>
    </div>`;
  }).join('');
}

function renderNLChart() {
  const fd = getFilteredData();
  const y = fd.nlY, n = fd.emails.filter(e=>e.newsletter==='N').length;
  const blank = fd.total - y - n;
  const ctx = document.getElementById('nlChart');
  if (charts.nl) charts.nl.destroy();
  charts.nl = new Chart(ctx, {
    type:'doughnut',
    data: {
      labels:['동의(Y)','미동의(N)','미표기'],
      datasets:[{data:[y,n,blank],backgroundColor:['#10B981','#94A3B8','#CBD5E1'],borderWidth:2,borderColor:'var(--card)'}]
    },
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:11},color:'var(--text)'}}}}
  });
}

function renderRegionChart() {
  const d = ALL_MONTHLY_DATA[currentMonth];
  if(!d) return;
  const regions = Object.keys(REGION_LABELS);
  const vals = regions.map(r => d.regionCounts[r]||0);
  const ctx = document.getElementById('regionChart');
  if(charts.region) charts.region.destroy();
  charts.region = new Chart(ctx, {
    type:'bar',
    data: {
      labels: regions.map(r=>REGION_LABELS[r]),
      datasets:[{
        label:'문의 건수',
        data: vals,
        backgroundColor: regions.map(r => currentRegion===r ? REGION_COLORS[r] : REGION_COLORS[r]+'99'),
        borderColor: regions.map(r=>REGION_COLORS[r]),
        borderWidth: 1.5,
        borderRadius: 5
      }]
    },
    options:{
      responsive:true, plugins:{legend:{display:false}},
      scales:{y:{ticks:{color:'var(--text)'},grid:{color:'var(--border)'}},x:{ticks:{color:'var(--text)'},grid:{display:false}}},
      onClick:(e,items)=>{ if(items.length) toggleRegion(regions[items[0].index]); }
    }
  });
}

function renderTrendChart(year) {
  const months = getMonthsOfYear(year);
  const labels = months.map(m => ALL_MONTHLY_DATA[m]?.label || m);
  const vals = months.map(m => ALL_MONTHLY_DATA[m]?.total || 0);
  const colors = months.map(m => m===currentMonth ? '#e42526' : '#94a3b8');
  const ctx = document.getElementById('trendChart');
  if(charts.trend) charts.trend.destroy();
  charts.trend = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[{
        label:'문의 건수',
        data:vals,
        borderColor:'#e42526',
        backgroundColor:'rgba(228,37,38,0.08)',
        pointBackgroundColor:colors,
        pointRadius:months.map(m=>m===currentMonth?7:4),
        pointBorderColor:colors,
        tension:0.3,
        fill:true
      }]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false}},
      scales:{
        y:{ticks:{color:'var(--text)'},grid:{color:'var(--border)'}},
        x:{ticks:{color:'var(--text)'},grid:{display:false}}
      },
      onClick:(e,items)=>{ if(items.length) loadMonth(months[items[0].index]); }
    }
  });
}

function renderRegionGrid() {
  const d = ALL_MONTHLY_DATA[currentMonth];
  if(!d) return;
  const el = document.getElementById('regionGrid');
  const regions = Object.keys(REGION_LABELS);
  el.innerHTML = regions.map(r => {
    const cnt = d.regionCounts[r]||0;
    const nlY = d.regionNL?.[r]||0;
    const isActive = currentRegion===r;
    return `<div class="region-card ${isActive?'active':''}" data-region="${r}" onclick="toggleRegion('${r}')"
      style="border-color:${isActive?'var(--accent)':REGION_COLORS[r]+'55'}">
      <div class="region-name" style="color:${REGION_COLORS[r]}">${REGION_LABELS[r]}</div>
      <div class="region-count" style="color:${REGION_COLORS[r]}">${cnt}</div>
      <div class="region-nl">NL-Y: ${nlY}건</div>
    </div>`;
  }).join('');
}

function renderEmailPanel() {
  const d = ALL_MONTHLY_DATA[currentMonth];
  if(!d) return;
  const regions = Object.keys(REGION_LABELS).filter(r => (d.regionCounts[r]||0)>0);
  const tabEl = document.getElementById('regionTabs');
  const showRegions = currentRegion==='all' ? regions : [currentRegion];

  tabEl.innerHTML = (currentRegion==='all' ? ['all',...regions] : [currentRegion]).map(r => {
    const isAll = r==='all';
    const label = isAll ? '전체' : REGION_LABELS[r];
    const active = currentRegion===r;
    return `<button class="tab ${active?'active':''}" onclick="${isAll?'selectRegion(\'all\')':'toggleRegion(\''+r+'\')'}">${label}</button>`;
  }).join('');

  const emails = getFilteredData().emails;
  const cardEl = document.getElementById('emailCards');
  if(emails.length===0) { cardEl.innerHTML='<div style="color:var(--sub);padding:20px">문의 없음</div>'; return; }

  cardEl.innerHTML = emails.slice(0,30).map(e => {
    const rc = REGION_COLORS[e.region]||'#999';
    const tc = TYPE_COLORS[e.type]||'#999';
    const nlBadge = e.newsletter==='Y'
      ? '<span class="badge" style="background:#10B981">NL-Y</span>'
      : (e.newsletter==='N' ? '<span style="font-size:11px;color:var(--sub)">NL-N</span>' : '');
    return `<div class="email-card">
      <div class="email-card-header">
        <div>
          <span class="badge" style="background:${rc};margin-right:4px">${REGION_LABELS[e.region]||e.region}</span>
          <span class="badge" style="background:${tc}">${TYPE_LABELS[e.type]||e.type}</span>
        </div>
        ${nlBadge}
      </div>
      <div class="email-name">${e.name||'-'}</div>
      <div class="email-datetime">${e.country} · ${e.datetime}</div>
      <div class="email-summary">${e.summary||'-'}</div>
      <div class="action-badge">⚡ ${e.action||'-'}</div>
    </div>`;
  }).join('');
}

function renderTable() {
  const emails = getFilteredData().emails;
  document.getElementById('tableInfo').textContent = `${emails.length}건 표시`;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = [...emails].sort((a,b)=>b.datetime.localeCompare(a.datetime)).map(e => {
    const rc = REGION_COLORS[e.region]||'#999';
    const tc = TYPE_COLORS[e.type]||'#999';
    const nl = e.newsletter==='Y' ? '<span class="nl-y">Y</span>' : (e.newsletter==='N'?'<span class="nl-n">N</span>':'<span class="nl-n">-</span>');
    return `<tr>
      <td style="white-space:nowrap;font-size:12px">${e.datetime}</td>
      <td><span class="badge" style="background:${rc}">${REGION_LABELS[e.region]||e.region}</span></td>
      <td>${e.country||'-'}</td>
      <td style="font-weight:600">${e.name||'-'}</td>
      <td style="font-size:12px">${e.email||'-'}</td>
      <td style="font-size:12px">${e.phone||'-'}</td>
      <td><span class="badge" style="background:${tc}">${TYPE_LABELS[e.type]||e.type}</span></td>
      <td>${nl}</td>
      <td style="font-size:12px;max-width:220px">${e.summary||'-'}</td>
      <td style="font-size:12px;max-width:150px">${e.action||'-'}</td>
    </tr>`;
  }).join('');
}

function toggleDark() {
  document.body.classList.toggle('dark');
}

initNav();
renderAll();
</script>
