<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CTR Aftermarket 고객 문의 누적 보고서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f8fafc; --card:#fff; --text:#0f172a; --sub:#64748b;
  --border:#e2e8f0; --accent:#e42526; --accent2:#1e40af;
  --shadow:0 2px 8px rgba(0,0,0,.08);
}
.dark {
  --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --sub:#94a3b8;
  --border:#334155; --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;transition:background .3s,color .3s}
.header{background:var(--accent);color:#fff;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:700}
.header-sub{font-size:13px;opacity:.85;margin-top:4px}
.header-btns{display:flex;gap:8px}
.btn{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:13px;transition:.2s}
.btn:hover{background:rgba(255,255,255,.3)}
.container{max-width:1400px;margin:0 auto;padding:24px 20px}
/* nav */
.year-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.year-tab{padding:6px 18px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;font-size:13px;transition:.2s}
.year-tab.active,.year-tab:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.month-btns{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.month-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:.2s}
.month-btn:hover{border-color:var(--accent);color:var(--accent)}
.month-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
/* summary grid */
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:28px}
@media(max-width:900px){.summary-grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.kpi-val{font-size:40px;font-weight:800;color:var(--accent)}
.kpi-sub{font-size:13px;color:var(--sub);margin-top:4px}
.kpi-nl{font-size:32px;font-weight:800;color:#16a34a}
/* type bars */
.type-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.type-label{font-size:12px;width:70px;flex-shrink:0}
.type-bar-wrap{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.type-bar{height:100%;border-radius:5px;transition:width .4s}
.type-count{font-size:12px;font-weight:600;width:24px;text-align:right;flex-shrink:0}
/* charts */
.chart-wrap{height:220px;position:relative}
/* region KPI */
.region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
@media(max-width:800px){.region-grid{grid-template-columns:repeat(2,1fr)}}
.region-card{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);border:2px solid var(--border);cursor:pointer;transition:.2s;text-align:center}
.region-card:hover,.region-card.active{border-color:var(--accent);transform:translateY(-2px)}
.region-card .r-name{font-size:11px;color:var(--sub);margin-bottom:4px}
.region-card .r-val{font-size:26px;font-weight:800}
.region-card .r-nl{font-size:11px;margin-top:2px}
/* trend */
.trend-wrap{height:180px;position:relative;margin-bottom:28px}
/* tabs */
.region-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.rtab{padding:5px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;font-size:12px;transition:.2s}
.rtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* email cards */
.email-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:28px}
.email-card{background:var(--card);border-radius:10px;padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--accent);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.email-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.country-badge{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;font-weight:600}
.nl-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.nl-y{background:#dcfce7;color:#16a34a}
.nl-n{background:#fee2e2;color:#dc2626}
.nl-b{background:#f1f5f9;color:#64748b}
.email-card h4{font-size:13px;font-weight:600;margin-bottom:3px}
.email-card .dt{font-size:11px;color:var(--sub)}
.email-card .summary{font-size:12px;color:var(--sub);margin:6px 0;line-height:1.5}
.action-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#fef3c7;color:#92400e;display:inline-block}
/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--accent);color:#fff;padding:8px 10px;text-align:left;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
tr:hover td{background:rgba(228,37,38,.05)}
.type-badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block}
/* section title */
.section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:2px;display:inline-block}
footer{text-align:center;padding:24px;color:var(--sub);font-size:12px;border-top:1px solid var(--border)}
.reset-btn{padding:5px 14px;border-radius:14px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:12px;margin-left:8px}
.hidden{display:none}
</style>
</head>

  parts:{name:'부품정보',color:'#0EA5E9'},
  purchase:{name:'구매/주문',color:'#10B981'},
  price:{name:'가격/견적',color:'#F59E0B'},
  technical:{name:'기술지원',color:'#8B5CF6'},
  complaint:{name:'불만/AS',color:'#EF4444'},
  empty:{name:'내용없음',color:'#9CA3AF'},
  other:{name:'기타',color:'#6B7280'}
};

let currentYear='2026', currentMonth='2026-05', currentRegion='all';
let barChartInst=null, donutChartInst=null, trendChartInst=null;

function getAllYears(){return [...new Set(Object.keys(ALL_MONTHLY_DATA).map(k=>k.split('-')[0]))].sort();}
function getMonthsOfYear(y){return Object.keys(ALL_MONTHLY_DATA).filter(k=>k.startsWith(y)).sort();}

function buildNav(){
  const yt=document.getElementById('yearTabs');
  yt.innerHTML='';
  getAllYears().forEach(y=>{
    const b=document.createElement('button');
    b.className='year-tab'+(y===currentYear?' active':'');
    b.textContent=y+'년';
    b.onclick=()=>{currentYear=y;buildNav();loadMonth(getMonthsOfYear(y).slice(-1)[0]);}
    yt.appendChild(b);
  });
  const mb=document.getElementById('monthBtns');
  mb.innerHTML='';
  getMonthsOfYear(currentYear).forEach(m=>{
    const d=ALL_MONTHLY_DATA[m];
    const b=document.createElement('button');
    b.className='month-btn'+(m===currentMonth?' active':'');
    b.textContent=d.label.replace('년 ','년 ').replace('월','월 ('+d.total+'건)');
    b.onclick=()=>loadMonth(m);
    mb.appendChild(b);
  });
}

function loadMonth(ym){
  currentMonth=ym;
  currentRegion='all';
  buildNav();
  const d=ALL_MONTHLY_DATA[ym];
  renderKPI(d);
  renderTypeChart(d,null);
  renderBarChart(d,null);
  renderDonutChart(d,null);
  renderTrendChart(currentYear);
  renderRegionGrid(d);
  renderRegionTabs(d,'all');
  renderEmailCards(d,'all');
  renderTable(d,'all');
}

function renderKPI(d){
  document.getElementById('kpiTotal').textContent=d.total;
  document.getElementById('kpiSub').textContent=d.label+' 수신 총 문의건';
  document.getElementById('kpiNL').textContent=d.nlY;
  document.getElementById('kpiNLsub').textContent='동의율 '+Math.round(d.nlY/d.total*100)+'% ('+d.nlY+'/'+d.total+')';
}

function renderTypeChart(d,region){
  const el=document.getElementById('typeChart');
  el.innerHTML='';
  const counts=region?d.regionTypeCounts[region]:d.typeCounts;
  const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  Object.entries(TYPE_INFO).forEach(([k,v])=>{
    const n=counts[k]||0;
    if(!n)return;
    const pct=Math.round(n/total*100);
    el.innerHTML+=`<div class="type-row"><span class="type-label" style="color:${v.color};font-weight:600">${v.name}</span><div class="type-bar-wrap"><div class="type-bar" style="width:${pct}%;background:${v.color}"></div></div><span class="type-count">${n}</span></div>`;
  });
}

function renderBarChart(d,region){
  const ctx=document.getElementById('barChart').getContext('2d');
  if(barChartInst)barChartInst.destroy();
  const regions=Object.keys(REGION_INFO);
  const labels=regions.map(r=>REGION_INFO[r].name);
  const counts=region?[d.regionCounts[region]]:regions.map(r=>d.regionCounts[r]||0);
  const labelsF=region?[REGION_INFO[region].name]:labels;
  const colors=region?[REGION_INFO[region].color]:regions.map(r=>REGION_INFO[r].color);
  barChartInst=new Chart(ctx,{
    type:'bar',
    data:{labels:labelsF,datasets:[{data:counts,backgroundColor:colors,borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:11}}},y:{ticks:{stepSize:1},beginAtZero:true}}}
  });
}

function renderDonutChart(d,region){
  const ctx=document.getElementById('donutChart').getContext('2d');
  if(donutChartInst)donutChartInst.destroy();
  let nlY,nlN,nlB;
  if(region){nlY=d.regionNL[region]||0;nlN=d.regionNL_N[region]||0;nlB=d.regionNL_Blank[region]||0;}
  else{nlY=d.nlY;const emails=d.emails;nlN=emails.filter(e=>e.newsletter==='N').length;nlB=emails.filter(e=>e.newsletter!=='Y'&&e.newsletter!=='N').length;}
  donutChartInst=new Chart(ctx,{
    type:'doughnut',
    data:{labels:['동의(Y)','거부(N)','미표기'],datasets:[{data:[nlY,nlN,nlB],backgroundColor:['#16A34A','#EF4444','#94a3b8'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}
  });
}

function renderTrendChart(year){
  const ctx=document.getElementById('trendChart').getContext('2d');
  if(trendChartInst)trendChartInst.destroy();
  const months=getMonthsOfYear(year);
  const labels=months.map(m=>ALL_MONTHLY_DATA[m].label.replace('년 ','년\n'));
  const data=months.map(m=>ALL_MONTHLY_DATA[m].total);
  const ptColors=months.map(m=>m===currentMonth?'#e42526':'#2563EB');
  const ptSizes=months.map(m=>m===currentMonth?8:5);
  trendChartInst=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{data,borderColor:'#2563EB',backgroundColor:'rgba(37,99,235,.1)',pointBackgroundColor:ptColors,pointRadius:ptSizes,tension:.3,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:5}}},onClick:(e,el)=>{if(el.length)loadMonth(months[el[0].index]);}}
  });
}

function renderRegionGrid(d){
  const g=document.getElementById('regionGrid');
  g.innerHTML='';
  Object.entries(REGION_INFO).forEach(([r,v])=>{
    const cnt=d.regionCounts[r]||0;
    const nl=d.regionNL[r]||0;
    const card=document.createElement('div');
    card.className='region-card'+(r===currentRegion?' active':'');
    card.innerHTML=`<div class="r-name">${v.name}</div><div class="r-val" style="color:${v.color}">${cnt}</div><div class="r-nl">NL ${nl}건</div>`;
    card.onclick=()=>toggleRegion(r);
    g.appendChild(card);
  });
}

function toggleRegion(r){
  currentRegion=(currentRegion===r)?'all':r;
  const d=ALL_MONTHLY_DATA[currentMonth];
  renderRegionGrid(d);
  renderTypeChart(d,currentRegion==='all'?null:currentRegion);
  renderBarChart(d,currentRegion==='all'?null:currentRegion);
  renderDonutChart(d,currentRegion==='all'?null:currentRegion);
  renderRegionTabs(d,currentRegion);
  renderEmailCards(d,currentRegion);
  renderTable(d,currentRegion);
}
function selectRegion(r){currentRegion=r;toggleRegion(r==='all'?'__none__':r);}

function renderRegionTabs(d,active){
  const rt=document.getElementById('regionTabs');
  rt.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className='rtab'+(active==='all'?' active':'');
  allBtn.textContent='전체';
  allBtn.onclick=()=>selectRegion('all');
  rt.appendChild(allBtn);
  Object.entries(REGION_INFO).forEach(([r,v])=>{
    const cnt=d.regionCounts[r]||0;
    if(!cnt)return;
    const b=document.createElement('button');
    b.className='rtab'+(r===active?' active':'');
    b.textContent=v.name+' ('+cnt+')';
    b.onclick=()=>toggleRegion(r);
    rt.appendChild(b);
  });
}

function renderEmailCards(d,region){
  const ec=document.getElementById('emailCards');
  ec.innerHTML='';
  const emails=region==='all'?d.emails:d.emails.filter(e=>e.region===region);
  emails.forEach(e=>{
    const ri=REGION_INFO[e.region];
    const ti=TYPE_INFO[e.type];
    const nlClass=e.newsletter==='Y'?'nl-y':e.newsletter==='N'?'nl-n':'nl-b';
    const nlTxt=e.newsletter==='Y'?'뉴스레터✓':e.newsletter==='N'?'뉴스레터✗':'미표기';
    ec.innerHTML+=`<div class="email-card" style="border-left-color:${ri.color}">
      <div class="email-card-top">
        <span class="country-badge" style="background:${ri.color}">${e.country}</span>
        <span class="nl-badge ${nlClass}">${nlTxt}</span>
      </div>
      <h4>${e.name}</h4>
      <div class="dt">${e.datetime} &nbsp;|&nbsp; <span style="color:${ti.color};font-weight:600">${ti.name}</span></div>
      <div class="summary">${e.summary}</div>
      <span class="action-badge">⚡ ${e.action}</span>
    </div>`;
  });
  if(!emails.length) ec.innerHTML='<p style="color:var(--sub);padding:16px">해당 지역의 문의가 없습니다.</p>';
}

function renderTable(d,region){
  const tb=document.getElementById('tableBody');
  tb.innerHTML='';
  const emails=(region==='all'?d.emails:[...d.emails].filter(e=>e.region===region)).slice().reverse();
  emails.forEach(e=>{
    const ri=REGION_INFO[e.region];
    const ti=TYPE_INFO[e.type];
    tb.innerHTML+=`<tr>
      <td>${e.datetime}</td>
      <td><span style="color:${ri.color};font-weight:600">${ri.name}</span></td>
      <td>${e.country}</td>
      <td>${e.name}</td>
      <td style="font-size:11px">${e.email}</td>
      <td><span class="type-badge" style="background:${ti.color}22;color:${ti.color}">${ti.name}</span></td>
      <td>${e.newsletter}</td>
      <td style="max-width:250px;font-size:11px">${e.summary}</td>
      <td style="font-size:11px">${e.action}</td>
    </tr>`;
  });
}

function toggleDark(){document.body.classList.toggle('dark');}

// 초기화
buildNav();
loadMonth(currentMonth);
</script>
</body>
</html>
